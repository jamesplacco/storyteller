name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and test tools
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow fastapi httpx pytest
      - name: Run every chapter at toy scale
        run: pytest -x -v tests
