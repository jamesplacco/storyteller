name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned CPU environment
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow fastapi -r requirements-dev.txt -c constraints.txt
      - name: Run every chapter at toy scale
        run: pytest -x -v tests
