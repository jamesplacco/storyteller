chapter({
  n: 17, slug: "multimodal", title: "Multimodal", topics: "images as tokens, VQ-VAE, image GPT, diffusion transformers, illustrating stories", depth: "full", widget: "mm",
  idea: `<p><strong>To illustrate stories, the model needs pictures it can generate.</strong> There are two main routes, and you build both on CIFAR-10: 60,000 tiny 32×32 photos in 10 categories that include dog, cat, bird, frog, horse and ship.</p>
<ul><li><strong>Images as tokens.</strong> A VQ-VAE encoder shrinks each picture to an 8×8 grid of vectors. Each vector snaps to its nearest entry in a codebook of 512, so a picture becomes 64 integers, exactly like a short sentence. A decoder turns the integers back into pixels. The snap has no gradient, so training uses the <strong>straight-through estimator</strong>: the forward pass uses the snapped vector and the backward pass pretends the snap never happened. Codes nobody picks never learn, so <code>vqvae.py</code> moves these "dead" codes onto real encoder outputs.</li>
<li><strong>Image GPT.</strong> The Chapter 5 transformer, unchanged, trained on <code>[class token] + 64 image tokens</code>. Generating after the "dog" token draws a dog. This is how DALL·E 1 and Parti worked.</li>
<li><strong>Diffusion transformer.</strong> No tokens. Add Gaussian noise to a real image and train a transformer to predict that noise; generate by starting from pure noise and removing it in steps. Three changes to the Chapter 5 block: no causal mask, 4×4 pixel patches as tokens, and adaLN-Zero, where the noise level and class set each LayerNorm's scale and shift. <strong>Classifier-free guidance</strong> trains with 10% of labels hidden, then at sampling pushes away from the unlabeled prediction toward the labeled one.</li>
<li><strong>Illustrating.</strong> The final <code>app.py</code> finds an animal or vehicle in the story, maps it to a CIFAR class, and draws a picture under the text.</li></ul>
<p>Pictures at 32×32 from a few hours of Mac training are blurry: expect the right colors and rough shapes, not crisp objects. The pipeline is the point, and it scales unchanged to bigger images and more data.</p>`,
  code: [{ file: "vqvae.py", note: "The image tokenizer: encoder, codebook with dead-code restarts, decoder. Also tokenizes the whole dataset once.", src: "\"\"\"An image tokenizer: a VQ-VAE trained on CIFAR-10 (Chapter 17).\n\nA 32x32 color picture becomes an 8x8 grid of integers drawn from a codebook of 512 entries,\nso pictures become token sequences, just like text.\n\n  pip install pillow\n  python vqvae.py         # -> vqvae.pt, image_codes.pt, recon.png\n\"\"\"\nimport argparse, numpy as np, torch, torch.nn as nn, torch.nn.functional as F\nfrom PIL import Image\nfrom device import pick_device\n\nCLASSES = [\"airplane\", \"automobile\", \"bird\", \"cat\", \"deer\", \"dog\", \"frog\", \"horse\", \"ship\", \"truck\"]\nK, D = 512, 64                   # codebook size, code vector size\n\nclass VectorQuantizer(nn.Module):\n    def __init__(self, K=K, D=D, beta=0.25):\n        super().__init__()\n        self.codebook = nn.Embedding(K, D)\n        self.codebook.weight.data.uniform_(-1 / K, 1 / K)\n        self.beta = beta\n        self.register_buffer(\"usage\", torch.zeros(K))           # running count, to find dead codes\n\n    def forward(self, z):                                       # z: (B, N, D) encoder outputs\n        W = self.codebook.weight\n        d = z.pow(2).sum(-1, keepdim=True) - 2 * z @ W.T + W.pow(2).sum(-1)\n        idx = d.argmin(-1)                                      # (B, N) the image tokens\n        zq = self.codebook(idx)\n        loss = F.mse_loss(zq, z.detach()) + self.beta * F.mse_loss(z, zq.detach())\n        if self.training:\n            self.usage.mul_(0.99).add_(torch.bincount(idx.flatten(), minlength=W.size(0)).float(), alpha=0.01)\n        zq = z + (zq - z).detach()                              # straight-through estimator\n        return zq, idx, loss\n\n    @torch.no_grad()\n    def restart_dead_codes(self, z):\n        \"\"\"Codes nobody picks get no gradient and stay dead. Move them onto real encoder outputs.\"\"\"\n        dead = (self.usage < 0.01).nonzero().flatten()\n        if len(dead):\n            flat = z.reshape(-1, z.size(-1))\n            self.codebook.weight.data[dead] = flat[torch.randint(0, len(flat), (len(dead),))]\n            self.usage[dead] = 1.0\n        return len(dead)\n\nclass ResBlock(nn.Module):\n    def __init__(self, c):\n        super().__init__()\n        self.net = nn.Sequential(nn.ReLU(), nn.Conv2d(c, c, 3, padding=1), nn.ReLU(), nn.Conv2d(c, c, 1))\n    def forward(self, x):\n        return x + self.net(x)\n\nclass VQVAE(nn.Module):\n    def __init__(self, ch=128):\n        super().__init__()\n        self.enc = nn.Sequential(nn.Conv2d(3, ch, 4, 2, 1), nn.ReLU(),           # 32 -> 16\n                                 nn.Conv2d(ch, ch, 4, 2, 1),                      # 16 -> 8\n                                 ResBlock(ch), ResBlock(ch), nn.ReLU(), nn.Conv2d(ch, D, 1))\n        self.vq = VectorQuantizer()\n        self.dec = nn.Sequential(nn.Conv2d(D, ch, 3, padding=1), ResBlock(ch), ResBlock(ch), nn.ReLU(),\n                                 nn.ConvTranspose2d(ch, ch, 4, 2, 1), nn.ReLU(),  # 8 -> 16\n                                 nn.ConvTranspose2d(ch, 3, 4, 2, 1))              # 16 -> 32\n\n    def encode(self, x):                                        # (B, 3, 32, 32) -> z (B, 64, D)\n        return self.enc(x).flatten(2).transpose(1, 2)\n\n    def decode_z(self, zq):                                     # (B, 64, D) -> (B, 3, 32, 32)\n        B, N, _ = zq.shape\n        s = int(N ** 0.5)\n        return self.dec(zq.transpose(1, 2).reshape(B, D, s, s))\n\n    def decode_codes(self, idx):                                # (B, 64) ints -> images\n        return self.decode_z(self.vq.codebook(idx))\n\n    def forward(self, x):\n        z = self.encode(x)\n        zq, idx, vq_loss = self.vq(z)\n        return self.decode_z(zq), idx, vq_loss, z\n\ndef load_vqvae(path, device):\n    m = VQVAE().to(device)\n    m.load_state_dict(torch.load(path, map_location=device))\n    return m.eval()\n\ndef to_images(x):\n    \"\"\"(B, 3, 32, 32) in [-1, 1] -> list of PIL images.\"\"\"\n    x = ((x.clamp(-1, 1) + 1) * 127.5).round().byte().permute(0, 2, 3, 1).cpu().numpy()\n    return [Image.fromarray(a) for a in x]\n\ndef grid(images, ncol, scale=3):\n    w, h = images[0].size\n    nrow = (len(images) + ncol - 1) // ncol\n    g = Image.new(\"RGB\", (ncol * w, nrow * h), \"white\")\n    for i, im in enumerate(images):\n        g.paste(im, ((i % ncol) * w, (i // ncol) * h))\n    return g.resize((g.width * scale, g.height * scale), Image.NEAREST)\n\ndef load_cifar(split=\"train\"):\n    from datasets import load_dataset\n    ds = load_dataset(\"uoft-cs/cifar10\", split=split)\n    x = np.stack([np.asarray(im.convert(\"RGB\")) for im in ds[\"img\"]])\n    x = torch.from_numpy(x).permute(0, 3, 1, 2).float() / 127.5 - 1      # (N, 3, 32, 32) in [-1, 1]\n    return x, torch.tensor(ds[\"label\"])\n\nif __name__ == \"__main__\":\n    p = argparse.ArgumentParser()\n    p.add_argument(\"--steps\", type=int, default=6000)\n    args = p.parse_args()\n    device = pick_device()\n    torch.manual_seed(0)\n    x_all, y_all = load_cifar()\n    print(f\"{len(x_all):,} images\")\n    model = VQVAE().to(device)\n    opt = torch.optim.Adam(model.parameters(), lr=2e-4)\n    var = x_all.var().item()\n\n    for step in range(args.steps + 1):\n        x = x_all[torch.randint(0, len(x_all), (128,))].to(device)\n        recon, idx, vq_loss, z = model(x)\n        rec_loss = F.mse_loss(recon, x) / var\n        loss = rec_loss + vq_loss\n        opt.zero_grad(); loss.backward(); opt.step()\n        if step % 200 == 0 and step > 0:\n            dead = model.vq.restart_dead_codes(z.detach())\n        if step % 500 == 0:\n            used = (model.vq.usage > 0.01).sum().item()\n            print(f\"step {step:5d} | recon {rec_loss.item():.4f} | vq {vq_loss.item():.4f} | codes in use {used}/{K}\")\n\n    model.eval()\n    torch.save(model.state_dict(), \"vqvae.pt\")\n    codes = []\n    with torch.no_grad():                                       # tokenize the whole dataset once\n        for i in range(0, len(x_all), 1000):\n            codes.append(model.vq(model.encode(x_all[i:i + 1000].to(device)))[1].cpu())\n        x = x_all[:16].to(device)\n        recon = model(x)[0]\n    torch.save({\"codes\": torch.cat(codes).short(), \"labels\": y_all}, \"image_codes.pt\")\n    grid(to_images(torch.cat([x, recon])), ncol=16).save(\"recon.png\")\n    print(\"saved vqvae.pt, image_codes.pt, recon.png (top row: originals, bottom: from 64 tokens each)\")" },
    { file: "image_gpt.py", note: "Chapter 5's GPT trained on image tokens.", src: "\"\"\"Image GPT: the Chapter 5 transformer, unchanged, trained on image tokens (Chapter 17).\n\nEach training sequence is [class token] + 64 image tokens from vqvae.py. Vocabulary is the 512\ncodebook entries plus 10 class tokens. Generating after a class token draws a new picture.\n\n  python image_gpt.py     # needs image_codes.pt, vqvae.pt -> image_gpt.pt, samples.png\n\"\"\"\nimport argparse, math, torch\nfrom model import GPT, GPTConfig\nfrom vqvae import K, CLASSES, load_vqvae, to_images, grid\nfrom device import pick_device\n\ndef generate_codes(model, cls, n, temperature=1.0, top_k=100):\n    idx = torch.full((n, 1), K + cls, dtype=torch.long, device=next(model.parameters()).device)\n    out = model.generate_cached(idx, 64, temperature=temperature, top_k=top_k)[:, 1:]\n    return out.clamp(max=K - 1)            # class tokens are never targets, but be safe\n\ndef load_image_gpt(path, device):\n    ck = torch.load(path, map_location=device)\n    m = GPT(GPTConfig(**ck[\"cfg\"])).to(device)\n    m.load_state_dict(ck[\"model\"])\n    return m.eval()\n\nif __name__ == \"__main__\":\n    p = argparse.ArgumentParser()\n    p.add_argument(\"--steps\", type=int, default=8000)\n    args = p.parse_args()\n    device = pick_device()\n    torch.manual_seed(0)\n    data = torch.load(\"image_codes.pt\")\n    seqs = torch.cat([data[\"labels\"].long().unsqueeze(1) + K, data[\"codes\"].long()], dim=1)   # (N, 65)\n    cfg = GPTConfig(vocab_size=K + len(CLASSES), block_size=65, n_layer=6, n_head=6, n_embd=384)\n    model = GPT(cfg).to(device)\n    steps, warmup, max_lr = args.steps, 200, 6e-4\n    opt = torch.optim.AdamW(model.parameters(), lr=max_lr, betas=(0.9, 0.95), weight_decay=0.1)\n\n    for step in range(steps):\n        lr = max_lr * min(1, (step + 1) / warmup) * 0.5 * (1 + math.cos(math.pi * step / steps))\n        for g in opt.param_groups:\n            g[\"lr\"] = lr\n        b = seqs[torch.randint(0, len(seqs), (64,))].to(device)\n        _, loss = model(b[:, :-1], b[:, 1:])          # predict every image token from what precedes it\n        opt.zero_grad(); loss.backward()\n        torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)\n        opt.step()\n        if step % 250 == 0:\n            print(f\"step {step:5d} | loss {loss.item():.3f} | lr {lr:.1e}\")\n    torch.save({\"model\": model.state_dict(), \"cfg\": vars(cfg)}, \"image_gpt.pt\")\n\n    model.eval()\n    vq = load_vqvae(\"vqvae.pt\", device)\n    with torch.no_grad():\n        imgs = [im for c in range(len(CLASSES)) for im in to_images(vq.decode_codes(generate_codes(model, c, 8)))]\n    grid(imgs, ncol=8).save(\"samples.png\")\n    print(\"saved image_gpt.pt and samples.png (one row per class: \" + \", \".join(CLASSES) + \")\")" },
    { file: "dit.py", note: "A class-conditional diffusion transformer with DDIM sampling and classifier-free guidance.", src: "\"\"\"A diffusion transformer (DiT) on CIFAR-10 (Chapter 17). The other way to make pictures.\n\nNo tokens: the model learns to remove Gaussian noise. Training adds a random amount of noise\nto a real image and asks the transformer to predict that noise. Sampling starts from pure noise\nand removes it step by step (DDIM, 50 steps), steered by the class with classifier-free guidance.\n\nThe transformer is Chapter 5's block with three changes: no causal mask, the image cut into\n4x4 patches as tokens, and adaLN-Zero (timestep and class set each LayerNorm's scale and shift).\n\n  python dit.py          # -> dit.pt, dit_samples.png\n\"\"\"\nimport argparse, math, torch, torch.nn as nn, torch.nn.functional as F\nfrom vqvae import CLASSES, load_cifar, to_images, grid\nfrom device import pick_device\n\nPATCH, C, LAYERS, HEADS, NSTEPS = 4, 256, 6, 8, 1000\nN_TOK, P_DIM = (32 // PATCH) ** 2, 3 * PATCH * PATCH          # 64 tokens of 48 numbers each\n\nbetas = torch.linspace(1e-4, 0.02, NSTEPS)                     # DDPM noise schedule\nalpha_bar = torch.cumprod(1 - betas, 0)                        # fraction of signal left at step t\n\ndef patchify(x):       # (B, 3, 32, 32) -> (B, 64, 48)\n    B = x.size(0)\n    return x.unfold(2, PATCH, PATCH).unfold(3, PATCH, PATCH).permute(0, 2, 3, 1, 4, 5).reshape(B, N_TOK, P_DIM)\n\ndef unpatchify(p):     # (B, 64, 48) -> (B, 3, 32, 32)\n    B, g = p.size(0), 32 // PATCH\n    return p.reshape(B, g, g, 3, PATCH, PATCH).permute(0, 3, 1, 4, 2, 5).reshape(B, 3, 32, 32)\n\ndef timestep_embedding(t, dim=C):\n    half = dim // 2\n    freqs = torch.exp(-math.log(10000) * torch.arange(half, device=t.device) / half)\n    a = t.float()[:, None] * freqs[None]\n    return torch.cat([a.cos(), a.sin()], -1)\n\ndef modulate(x, shift, scale):\n    return x * (1 + scale.unsqueeze(1)) + shift.unsqueeze(1)\n\nclass DiTBlock(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.ln1 = nn.LayerNorm(C, elementwise_affine=False)\n        self.qkv, self.proj = nn.Linear(C, 3 * C), nn.Linear(C, C)\n        self.ln2 = nn.LayerNorm(C, elementwise_affine=False)\n        self.mlp = nn.Sequential(nn.Linear(C, 4 * C), nn.GELU(approximate=\"tanh\"), nn.Linear(4 * C, C))\n        self.ada = nn.Linear(C, 6 * C)                    # condition -> 2 shifts, 2 scales, 2 gates\n        nn.init.zeros_(self.ada.weight); nn.init.zeros_(self.ada.bias)   # \"Zero\": block starts as identity\n\n    def forward(self, x, c):\n        s1, sc1, g1, s2, sc2, g2 = self.ada(F.silu(c)).chunk(6, -1)\n        B, T, _ = x.shape\n        q, k, v = self.qkv(modulate(self.ln1(x), s1, sc1)).split(C, -1)\n        q, k, v = [t.view(B, T, HEADS, C // HEADS).transpose(1, 2) for t in (q, k, v)]\n        a = F.scaled_dot_product_attention(q, k, v)       # every patch sees every patch\n        x = x + g1.unsqueeze(1) * self.proj(a.transpose(1, 2).reshape(B, T, C))\n        x = x + g2.unsqueeze(1) * self.mlp(modulate(self.ln2(x), s2, sc2))\n        return x\n\nclass DiT(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.patch_in = nn.Linear(P_DIM, C)\n        self.pos = nn.Parameter(torch.randn(1, N_TOK, C) * 0.02)\n        self.t_mlp = nn.Sequential(nn.Linear(C, C), nn.SiLU(), nn.Linear(C, C))\n        self.y_emb = nn.Embedding(len(CLASSES) + 1, C)    # last index = \"no class\", for guidance\n        self.blocks = nn.ModuleList([DiTBlock() for _ in range(LAYERS)])\n        self.ln_f = nn.LayerNorm(C, elementwise_affine=False)\n        self.ada_f = nn.Linear(C, 2 * C)\n        self.patch_out = nn.Linear(C, P_DIM)\n        for m in (self.ada_f, self.patch_out):\n            nn.init.zeros_(m.weight); nn.init.zeros_(m.bias)\n\n    def forward(self, x, t, y):                           # predicts the noise in x\n        h = self.patch_in(patchify(x)) + self.pos\n        c = self.t_mlp(timestep_embedding(t)) + self.y_emb(y)\n        for b in self.blocks:\n            h = b(h, c)\n        shift, scale = self.ada_f(F.silu(c)).chunk(2, -1)\n        return unpatchify(self.patch_out(modulate(self.ln_f(h), shift, scale)))\n\n@torch.no_grad()\ndef sample(model, y, steps=50, guidance=3.0):\n    \"\"\"DDIM: a deterministic walk from noise to image in `steps` jumps.\"\"\"\n    dev = y.device\n    ab = alpha_bar.to(dev)\n    x = torch.randn(len(y), 3, 32, 32, device=dev)\n    null = torch.full_like(y, len(CLASSES))\n    ts = torch.linspace(NSTEPS - 1, 0, steps, device=dev).long()\n    for i, t in enumerate(ts):\n        tt = t.repeat(len(y))\n        eps_c, eps_u = model(x, tt, y), model(x, tt, null)\n        eps = eps_u + guidance * (eps_c - eps_u)          # classifier-free guidance\n        x0 = (x - (1 - ab[t]).sqrt() * eps) / ab[t].sqrt()            # current guess of the clean image\n        x0 = x0.clamp(-1, 1)\n        ab_prev = ab[ts[i + 1]] if i + 1 < len(ts) else torch.tensor(1.0, device=dev)\n        x = ab_prev.sqrt() * x0 + (1 - ab_prev).sqrt() * eps          # jump to the next noise level\n    return x\n\nif __name__ == \"__main__\":\n    p = argparse.ArgumentParser()\n    p.add_argument(\"--steps\", type=int, default=20000)\n    args = p.parse_args()\n    device = pick_device()\n    torch.manual_seed(0)\n    x_all, y_all = load_cifar()\n    model = DiT().to(device)\n    print(f\"{sum(p.numel() for p in model.parameters()) / 1e6:.1f}M params\")\n    opt = torch.optim.AdamW(model.parameters(), lr=3e-4, weight_decay=0.0)\n    ab = alpha_bar.to(device)\n\n    for step in range(args.steps + 1):\n        i = torch.randint(0, len(x_all), (128,))\n        x0, y = x_all[i].to(device), y_all[i].to(device)\n        x0 = torch.where(torch.rand(len(x0), 1, 1, 1, device=device) < 0.5, x0, x0.flip(3))  # random mirror\n        y = torch.where(torch.rand(len(y), device=device) < 0.1, torch.full_like(y, len(CLASSES)), y)  # 10% unconditional\n        t = torch.randint(0, NSTEPS, (len(x0),), device=device)\n        noise = torch.randn_like(x0)\n        a = ab[t].view(-1, 1, 1, 1)\n        xt = a.sqrt() * x0 + (1 - a).sqrt() * noise       # jump straight to noise level t\n        loss = F.mse_loss(model(xt, t, y), noise)\n        opt.zero_grad(); loss.backward()\n        torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)\n        opt.step()\n        if step % 500 == 0:\n            print(f\"step {step:5d} | loss {loss.item():.4f}\")\n        if step % 5000 == 0 and step > 0:\n            torch.save(model.state_dict(), \"dit.pt\")\n\n    torch.save(model.state_dict(), \"dit.pt\")\n    model.eval()\n    y = torch.arange(len(CLASSES), device=device).repeat_interleave(8)\n    grid(to_images(sample(model, y)), ncol=8).save(\"dit_samples.png\")\n    print(\"saved dit.pt and dit_samples.png (one row per class)\")" },
    { file: "app.py", note: "The final web app: KV-cache streaming from Chapter 12, the best chat checkpoint you have, and illustrations.", src: "\"\"\"The Storyteller web app (Chapters 16 and 17).\n\nStreams a story token by token with the KV-cache, then draws an illustration for it with the\nimage GPT if you trained one in Chapter 17.\n\n  pip install fastapi uvicorn pillow\n  uvicorn app:app --port 8000          # then open http://localhost:8000\n\"\"\"\nimport codecs, io, os, random, re, threading, torch\nfrom fastapi import FastAPI, HTTPException\nfrom fastapi.responses import HTMLResponse, StreamingResponse, Response\nfrom pydantic import BaseModel, Field\nfrom model import GPT, GPTConfig\nfrom bpe import BPETokenizer\nfrom device import pick_device\n\ndef fail(msg):\n    raise SystemExit(f\"\\nStoryteller can't start: {msg}\\n\")\n\ndevice = pick_device()\nif not os.path.exists(\"tok.pkl\"):\n    fail(\"tok.pkl is missing. Train the tokenizer first (Chapter 6): python train_tok.py\")\ntok = BPETokenizer().load(\"tok.pkl\")\nEOT = tok.special[\"<|endoftext|>\"]\n\nif os.environ.get(\"CKPT\"):\n    CKPT, CHOSEN_BY = os.environ[\"CKPT\"], \"set with CKPT\"\n    if not os.path.exists(CKPT):\n        fail(f\"CKPT={CKPT} was requested but there is no such file in {os.getcwd()}.\")\nelse:\n    found = [p for p in [\"chat_ppo.pt\", \"chat_dpo.pt\", \"chat.pt\"] if os.path.exists(p)]\n    if not found:\n        fail(\"no chat model here (chat.pt, chat_dpo.pt or chat_ppo.pt). Make one with Chapter 14: python sft.py\")\n    CKPT, CHOSEN_BY = found[0], \"default: latest tuning stage present, not an evaluation result\"\nck = torch.load(CKPT, map_location=device)\nif ck[\"cfg\"][\"vocab_size\"] != len(tok.vocab):\n    fail(f\"{CKPT} was trained with a {ck['cfg']['vocab_size']:,}-token vocabulary but tok.pkl has {len(tok.vocab):,}. \"\n         \"Use the tok.pkl it was trained with, or retrain from Chapter 6.\")\nmodel = GPT(GPTConfig(**ck[\"cfg\"])).to(device).eval()\nmodel.load_state_dict(ck[\"model\"])\nprint(f\"story model: {CKPT} ({CHOSEN_BY}). Compare checkpoints with eval.py; pick one with CKPT=...\")\ngpu = threading.Lock()                     # requests run on several threads; the GPU takes one at a time\n\n# ---- optional illustrator (Chapter 17) ----\nillustrator = None\nif os.path.exists(\"image_gpt.pt\") and os.path.exists(\"vqvae.pt\"):\n    from vqvae import CLASSES, load_vqvae, to_images\n    from image_gpt import load_image_gpt, generate_codes\n    illustrator = (load_image_gpt(\"image_gpt.pt\", device), load_vqvae(\"vqvae.pt\", device))\n    print(\"illustrator: on\")\nWORD_TO_CLASS = {\"dog\": \"dog\", \"puppy\": \"dog\", \"cat\": \"cat\", \"kitten\": \"cat\", \"bird\": \"bird\", \"frog\": \"frog\",\n                 \"horse\": \"horse\", \"pony\": \"horse\", \"deer\": \"deer\", \"boat\": \"ship\", \"ship\": \"ship\",\n                 \"car\": \"automobile\", \"truck\": \"truck\", \"plane\": \"airplane\", \"airplane\": \"airplane\"}\n\n@torch.no_grad()\ndef stream_tokens(ids, max_new=300, temperature=0.8, top_k=50):\n    \"\"\"Chapter 12's KV-cache loop, yielding each token as soon as it is sampled.\"\"\"\n    pasts, x_in, pos0 = [None] * len(model.blocks), torch.tensor([ids], device=device), 0\n    for _ in range(max_new):\n        T = x_in.size(1)\n        if pos0 + T > model.cfg.block_size:\n            break\n        x = model.wte(x_in) + model.wpe(torch.arange(pos0, pos0 + T, device=device))\n        for i, block in enumerate(model.blocks):\n            x, pasts[i] = block(x, pasts[i])\n        logits = model.lm_head(model.ln_f(x[:, -1, :]))[0] / max(temperature, 1e-3)\n        v, _ = torch.topk(logits, top_k)\n        logits[logits < v[-1]] = -float(\"inf\")\n        nxt = torch.multinomial(torch.softmax(logits, -1), 1)\n        if nxt.item() >= EOT:                  # end of story, or the model starting a new chat turn\n            break\n        yield nxt.item()\n        pos0, x_in = pos0 + T, nxt.view(1, 1)\n\nclass ChatRequest(BaseModel):\n    prompt: str = Field(min_length=1, max_length=2000)\n    temperature: float = Field(0.8, ge=0.1, le=2.0)\n\napp = FastAPI()\n\n@app.get(\"/info\")\ndef info():\n    return {\"model\": CKPT, \"chosen_by\": CHOSEN_BY, \"params\": sum(p.numel() for p in model.parameters()),\n            \"context_tokens\": model.cfg.block_size, \"device\": device, \"illustrations\": illustrator is not None}\n\n@app.post(\"/chat\")\ndef chat(req: ChatRequest):\n    ids = tok.encode(f\"<|user|>{req.prompt}<|assistant|>\")\n    if len(ids) >= model.cfg.block_size - 16:\n        raise HTTPException(400, \"That request is too long for this model's context. Try a shorter one.\")\n    def text():\n        dec = codecs.getincrementaldecoder(\"utf-8\")(errors=\"replace\")   # holds back half a character\n        steps = stream_tokens(ids, temperature=req.temperature)\n        while True:\n            with gpu:\n                t = next(steps, None)\n            if t is None:\n                break\n            piece = dec.decode(tok.vocab[t])\n            if piece:\n                yield piece\n        yield dec.decode(b\"\", final=True)\n    return StreamingResponse(text(), media_type=\"text/plain\")\n\n@app.get(\"/illustrate\")\ndef illustrate(text: str = \"\"):\n    if illustrator is None:\n        return Response(status_code=404)\n    words = re.findall(r\"[a-z]+\", text.lower())\n    hits = [WORD_TO_CLASS[w] for w in words if w in WORD_TO_CLASS]\n    name = hits[0] if hits else random.choice([\"bird\", \"cat\", \"dog\", \"frog\", \"horse\"])\n    cls = CLASSES.index(name)\n    gpt, vq = illustrator\n    with gpu, torch.no_grad():\n        img = to_images(vq.decode_codes(generate_codes(gpt, cls, 1)))[0].resize((192, 192))\n    buf = io.BytesIO(); img.save(buf, format=\"PNG\")\n    return Response(buf.getvalue(), media_type=\"image/png\",\n                    headers={\"X-Class\": name, \"X-Class-Source\": \"story\" if hits else \"random\"})\n\nPAGE = \"\"\"<!doctype html><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Storyteller<\/title>\n<style>\n:root{--bg:#fff;--ink:#0a0b0d;--muted:#5c6169;--line:#e1e3e7;--sunk:#f3f4f6;--red:#d0202f;color-scheme:light}\n@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f2f3f5;--muted:#9aa0a8;--line:#24272c;--sunk:#0c0d0f;--red:#ff3b4a;color-scheme:dark}}\n*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{background:#000;color:#fff;padding:18px 20px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}\nheader b{letter-spacing:.32em;font-size:15px} header span{color:#9aa0a8;font-size:13px}\nmain{max-width:680px;margin:0 auto;padding:24px 16px 120px}\n.you{color:var(--muted);font-style:italic;margin:28px 0 6px} .story{white-space:pre-wrap;margin:0}\n.err{color:var(--red);border-left:3px solid var(--red);padding:4px 0 4px 12px}\nfigure{margin:12px 0 0} img{image-rendering:pixelated;display:block;width:192px;height:192px;border:1px solid var(--line)}\nfigcaption{font-size:13px;color:var(--muted);margin-top:6px}\nform{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;justify-content:center}\ninput{flex:1;max-width:560px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:var(--sunk);color:var(--ink)}\nbutton{font:600 13px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:0 18px;border-radius:2px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer}\nbutton.stop{background:transparent;color:var(--ink);border-color:var(--ink)}\n<\/style>\n<header><b>STORYTELLER<\/b><span id=\"info\">loading model info\u2026<\/span><\/header>\n<main id=\"log\"><\/main>\n<form id=\"f\"><input id=\"q\" placeholder=\"Tell me a story about a brave frog\" maxlength=\"2000\" autofocus><button id=\"go\">Send<\/button><\/form>\n<script>\nlet busy = null;\nfetch(\"/info\").then(r => r.json()).then(i => {\n  info.textContent = `${i.model} (${i.chosen_by}) \u00b7 ${(i.params / 1e6).toFixed(1)}M parameters \u00b7 ${i.context_tokens}-token context \u00b7 ${i.device}` +\n    (i.illustrations ? \" \u00b7 illustrations on\" : \" \u00b7 illustrations off (train Chapter 17)\");\n}).catch(() => { info.textContent = \"could not reach the server\"; });\nfunction add(tag, cls, text) { const el = document.createElement(tag); if (cls) el.className = cls; if (text) el.textContent = text; log.append(el); return el; }\nf.onsubmit = async (e) => {\n  e.preventDefault();\n  if (busy) { busy.abort(); return; }\n  const prompt = q.value.trim(); if (!prompt) return; q.value = \"\";\n  add(\"p\", \"you\", prompt);\n  const out = add(\"p\", \"story\");\n  busy = new AbortController(); go.textContent = \"Stop\"; go.className = \"stop\";\n  try {\n    const r = await fetch(\"/chat\", {method: \"POST\", headers: {\"Content-Type\": \"application/json\"},\n                                    body: JSON.stringify({prompt}), signal: busy.signal});\n    if (!r.ok) {\n      const body = await r.json().catch(() => ({}));\n      out.className = \"err\";\n      out.textContent = typeof body.detail === \"string\" ? body.detail\n        : \"The request was not accepted. Keep it between 1 and 2,000 characters.\";\n      return;\n    }\n    const reader = r.body.getReader(), dec = new TextDecoder();\n    for (;;) { const {done, value} = await reader.read(); if (done) break;\n               out.textContent += dec.decode(value, {stream: true}); window.scrollTo(0, document.body.scrollHeight); }\n    if (!out.textContent.trim()) { out.className = \"err\"; out.textContent = \"The model ended without writing anything. Try again.\"; return; }\n    const pic = await fetch(\"/illustrate?text=\" + encodeURIComponent(prompt + \" \" + out.textContent));\n    if (pic.ok) {\n      const fig = document.createElement(\"figure\"), img = new Image(), cap = document.createElement(\"figcaption\");\n      img.src = URL.createObjectURL(await pic.blob()); img.alt = \"Generated picture of a \" + pic.headers.get(\"X-Class\");\n      cap.textContent = `Class-conditioned 32\u00d732 picture of a ${pic.headers.get(\"X-Class\")} ` +\n        (pic.headers.get(\"X-Class-Source\") === \"story\" ? \"(word found in the story)\" : \"(no matching word, picked at random)\") +\n        \". It does not depict this specific story.\";\n      fig.append(img, cap); out.after(fig); window.scrollTo(0, document.body.scrollHeight);\n    }\n  } catch (err) {\n    if (err.name === \"AbortError\") { out.textContent += out.textContent ? \" [stopped]\" : \"[stopped]\"; }\n    else { out.className = \"err\"; out.textContent = \"Lost the connection to the server. Is uvicorn still running?\"; }\n  } finally { busy = null; go.textContent = \"Send\"; go.className = \"\"; }\n};\n<\/script>\"\"\"\n\n@app.get(\"/\", response_class=HTMLResponse)\ndef index():\n    return PAGE" }],

python vqvae.py        # -> vqvae.pt, image_codes.pt, recon.png
python image_gpt.py    # -> image_gpt.pt, samples.png

uvicorn app:app --port 8000`,
  expect: `<code>vqvae.py</code>: "codes in use" climbs toward 512, and in <code>recon.png</code> the bottom row is a softer copy of the top row. <code>samples.png</code>: one row per class with class-typical colors and layouts (sky and water behind planes and ships, green and brown around frogs and deer). <code>dit_samples.png</code> sharpens the longer you train. In the app, a picture appears under each story: the dog, cat, bird, frog, horse, deer, boat, car, truck or plane it mentions, or a random animal if it mentions none. Training times are estimates for an M-series Mac: VQ-VAE and image GPT 20 to 40 minutes each, DiT an hour or more.`,
  checks: [["Why are there two loss terms in the quantizer?", "The first pulls codebook vectors toward encoder outputs. The second (commitment) keeps the encoder from drifting away from the codebook. Each detaches the other side so each part gets its own pull."],
    ["How many bits does one picture carry as tokens?", "64 tokens × 9 bits each (log2 512) = 576 bits, versus 24,576 bits of raw pixels. The decoder has to fill in the rest, which is why reconstructions look soft."],

class Val {
  constructor(d, ch = [], op = "") { this.d = d; this.g = 0; this.ch = ch; this.op = op; this.bw = () => {}; }
  add(o) { const out = new Val(this.d + o.d, [this, o], "+"); out.bw = () => { this.g += out.g; o.g += out.g; }; return out; }
  mul(o) { const out = new Val(this.d * o.d, [this, o], "×"); out.bw = () => { this.g += o.d * out.g; o.g += this.d * out.g; }; return out; }
  tanh() { const t = Math.tanh(this.d); const out = new Val(t, [this], "tanh"); out.bw = () => { this.g += (1 - t * t) * out.g; }; return out; }
  sqerr(y) { const df = this.d - y; const out = new Val(df * df, [this], "sq"); out.bw = () => { this.g += 2 * df * out.g; }; return out; }
  backward() { const topo = [], seen = new Set(); const b = v => { if (!seen.has(v)) { seen.add(v); v.ch.forEach(b); topo.push(v); } }; b(this); this.g = 1; for (let i = topo.length - 1; i >= 0; i--) topo[i].bw(); }
}

W.matmul = el => {
  el.innerHTML = `<p class="lab-note">Runs an n×n float32 matmul in your browser three ways, the same three as <code>matmul.c</code>. Same arithmetic, different memory access.</p>
  <div class="row"><label class="ctl" style="display:flex;gap:8px">Size <select id="mm-n"><option>256</option><option>512</option><option selected>768</option><option>1024</option></select></label><button class="btn" id="mm-go">Run benchmark</button></div>
  <div class="bars" id="mm-r"><div class="lab-note">Press run. 768 takes a few seconds. At 256 everything fits in cache and the three tie; from 768 up, i-j-k falls behind.</div></div>`;
  function mm(n, order) {
    const A = new Float32Array(n * n), B = new Float32Array(n * n), C = new Float32Array(n * n);
    for (let i = 0; i < n * n; i++) { A[i] = Math.random(); B[i] = Math.random(); }
    const t = performance.now();
    if (order === "ijk") { for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { let s = 0; for (let k = 0; k < n; k++) s += A[i * n + k] * B[k * n + j]; C[i * n + j] = s; } }
    else if (order === "ikj") { for (let i = 0; i < n; i++) for (let k = 0; k < n; k++) { const a = A[i * n + k], o = i * n, q = k * n; for (let j = 0; j < n; j++) C[o + j] += a * B[q + j]; } }
    else { const Tl = 32; for (let ii = 0; ii < n; ii += Tl) for (let kk = 0; kk < n; kk += Tl) for (let jj = 0; jj < n; jj += Tl)
      for (let i = ii; i < ii + Tl; i++) for (let k = kk; k < kk + Tl; k++) { const a = A[i * n + k], o = i * n, q = k * n; for (let j = jj; j < jj + Tl; j++) C[o + j] += a * B[q + j]; } }
    return 2 * n ** 3 / ((performance.now() - t) / 1000) / 1e9;
  }
  $("#mm-go", el).onclick = () => {
    const n = +$("#mm-n", el).value, btn = $("#mm-go", el); btn.disabled = true; $("#mm-r", el).innerHTML = `<div class="lab-note">Running…</div>`;
    setTimeout(() => {
      mm(64, "ikj"); mm(64, "ijk"); mm(64, "tiled");
      const r = [["i-j-k", mm(n, "ijk"), "inner loop strides down B's columns"], ["i-k-j", mm(n, "ikj"), "inner loop walks rows in order"], ["tiled", mm(n, "tiled"), "32×32 blocks reused while they sit in cache"]];
      const mx = Math.max(...r.map(x => x[1]));
      $("#mm-r", el).innerHTML = r.map(([nm, g, d]) => `<div class="barrow"><span>${nm}</span><div class="track"><div class="fill" style="width:${g / mx * 100}%"></div></div><span class="v">${g.toFixed(2)} GFLOPS</span></div><div class="lab-note" style="margin:-2px 0 4px 106px">${d}</div>`).join("") +
        `<p class="lab-note">In the browser, tiling rarely beats i-k-j: JavaScript can't use the CPU's vector units the way C compiled with -O3 can, so the bottleneck is arithmetic, not cache. <code>matmul.c</code> shows tiling's real gain. For scale, Apple Silicon GPUs reach thousands of GFLOPS through PyTorch's mps backend.</p>`;
      btn.disabled = false;
    }, 30);
  };
};

W.diffuse = el => {
  const S = 32, img = new Float32Array(S * S * 3), r = rng(21), noise = Float32Array.from({ length: S * S * 3 }, () => randn(r));
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {           // a little scene, built from shapes
    let c = [0.35 + y / 60, 0.6 + y / 80, 0.95];
    if ((x - 24) ** 2 + (y - 7) ** 2 < 18) c = [1, 0.85, 0.3];
    if (y > 20 + 3 * Math.sin(x / 6)) c = [0.3, 0.65, 0.3];
    if (x >= 7 && x <= 15 && y >= 16 && y <= 24) c = [0.85, 0.45, 0.3];
    if (y >= 11 && y < 16 && Math.abs(x - 11) <= (y - 11) + 1) c = [0.55, 0.2, 0.2];
    if (x >= 10 && x <= 12 && y >= 20 && y <= 24) c = [0.35, 0.22, 0.12];
    for (let k = 0; k < 3; k++) img[(y * S + x) * 3 + k] = c[k] * 2 - 1;
  }
  const ab = []; let p = 1; for (let t = 0; t < 1000; t++) { p *= 1 - (1e-4 + (0.02 - 1e-4) * t / 999); ab.push(p); }
  el.innerHTML = `<div class="g2"><div class="row" style="align-items:flex-start;gap:14px"><canvas id="df-cv" width="32" height="32" style="width:192px;height:192px;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line)"></canvas>
    <canvas id="df-sp" width="32" height="32" style="width:96px;height:96px;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line)"></canvas></div>
  <div class="stack">${slider("df-t", "Noise step t", 0, 999, 1, 100)}
    <div class="stats"><div class="stat"><span class="stat-k">Signal kept √ᾱ</span><span class="stat-v" id="df-s"></span></div><div class="stat"><span class="stat-k">Noise √(1−ᾱ)</span><span class="stat-v" id="df-n"></span></div></div>
    <p class="lab-note">Training jumps straight to any step: x_t = √ᾱ·image + √(1−ᾱ)·noise, using the same linear schedule as <code>dit.py</code>. The small square is the noise the model must predict. Sampling runs this backwards from t = 999.</p></div></div>`;
  const draw = (cv, f) => { const ctx = cv.getContext("2d"), d = ctx.createImageData(S, S); for (let i = 0; i < S * S; i++) { for (let k = 0; k < 3; k++) d.data[i * 4 + k] = Math.max(0, Math.min(255, (f(i * 3 + k) + 1) * 127.5)); d.data[i * 4 + 3] = 255; } ctx.putImageData(d, 0, 0); };
  draw($("#df-sp", el), i => noise[i] * 0.5);
  const render = t => { const a = ab[t], sa = Math.sqrt(a), sn = Math.sqrt(1 - a);
    draw($("#df-cv", el), i => sa * img[i] + sn * noise[i]); $("#df-s", el).textContent = sa.toFixed(3); $("#df-n", el).textContent = sn.toFixed(3); };
  bindSlider(el, "df-t", null, render); render(100);
};

function renderAppendix() {
  const llama = R`import torch, torch.nn as nn

class RMSNorm(nn.Module):              # Llama: drop LayerNorm's mean-centering and bias
    def __init__(self, d, eps=1e-6):
        super().__init__(); self.eps = eps; self.w = nn.Parameter(torch.ones(d))
    def forward(self, x):
        return x * torch.rsqrt(x.pow(2).mean(-1, keepdim=True) + self.eps) * self.w

def rope(x, pos0=0, base=10000):        # x: (B, n_head, T, head_size); apply to q and k
    B, nh, T, hs = x.shape
    inv = 1.0 / base ** (torch.arange(0, hs, 2, device=x.device).float() / hs)
    pos = torch.arange(pos0, pos0 + T, device=x.device).float()           # true positions, so the
    ang = pos[:, None] * inv[None]                                        # KV-cache keeps working
    cos, sin = ang.cos(), ang.sin()
    x1, x2 = x[..., 0::2], x[..., 1::2]
    return torch.stack([x1 * cos - x2 * sin, x1 * sin + x2 * cos], dim=-1).flatten(-2)

class SwiGLU(nn.Module):                # Llama's MLP
    def __init__(self, d, hidden):
        super().__init__()
        self.w1, self.w3 = nn.Linear(d, hidden, bias=False), nn.Linear(d, hidden, bias=False)
        self.w2 = nn.Linear(hidden, d, bias=False)
    def forward(self, x):
        return self.w2(nn.functional.silu(self.w1(x)) * self.w3(x))`;
  return `<div class="col">
  <header class="ch-head"><div class="ch-num" aria-hidden="true">A</div><div class="eyebrow">Appendix</div><h1>Further topics</h1><p class="lede" style="font-size:16px">The syllabus appendix, worked into short references with pointers back into the chapters.</p></header>
  <section class="stack" style="gap:14px"><h2 class="sec-label">Data types: integer, float, string</h2>
    <div class="prose"><p>Text reaches the model as bytes. ASCII covers English in 1 byte per character; UTF-8 encodes every other Unicode character in 2 to 4 bytes, and the BPE in Chapter 6 starts from exactly these bytes. Floats are covered bit by bit in Chapter 9; integers appear as token ids (uint16 on disk) and quantized weights (int8 in Chapter 13).</p></div>
    <section class="lab"><div class="lab-label">Try it</div><div id="lab-utf8"></div></section></section>
  <section class="stack" style="gap:14px"><h2 class="sec-label">Tensors: shapes, views, strides, contiguous</h2>
    <div class="prose"><p>A tensor is storage plus shape plus strides. Covered with runnable code in <a href="#ch08">Chapter 8</a>. Every <code>.view(B, T, n_head, hs).transpose(1, 2)</code> in <a href="#ch05">Chapter 5</a> is a stride trick, and the <code>.contiguous()</code> after re-joining heads is the copy that makes the next <code>.view</code> legal.</p></div></section>
  <section class="stack" style="gap:14px"><h2 class="sec-label">Programming languages: Python, C, Assembly</h2>
    <div class="prose"><p>Python orchestrates; C and GPU kernels do the arithmetic. <a href="#ch08">Chapter 8</a> has a C matmul. One level down, compile it with <code>clang -O3 -S matmul.c</code> and read <code>matmul.s</code>: on Apple Silicon you will find ARM NEON vector instructions (<code>fmla</code>) doing four float multiply-adds at once. That is the CPU's version of what a GPU does at much larger scale.</p></div></section>
  <section class="stack" style="gap:14px"><h2 class="sec-label">Frameworks: PyTorch and JAX</h2>
    <div class="prose"><p>This course uses PyTorch: eager execution, objects that hold state, <code>loss.backward()</code>. JAX takes a functional approach: a model is a pure function of its parameters, gradients come from <code>jax.grad(loss_fn)</code>, and <code>jax.jit</code> compiles the whole step through XLA. Same math, different ergonomics. JAX is common at Google and for TPU training.</p></div></section>
  <section class="stack" style="gap:14px"><h2 class="sec-label">Architectures: GPT-1 to 4, Llama, MoE</h2>
    <div class="prose"><ul>
      <li><strong>GPT-1 (2018)</strong> showed generative pretraining then finetuning. <strong>GPT-2 (2019)</strong> is our architecture: pre-LayerNorm, 1.5B parameters at the top size. <strong>GPT-3 (2020)</strong> scaled the same design to 175B and showed in-context learning. <strong>GPT-4</strong> architecture details are not public.</li>
      <li><strong>Llama</strong> swaps three parts of our model: RMSNorm instead of LayerNorm, rotary position embeddings (RoPE) instead of a learned position table (so positions are relative and context can stretch), and a SwiGLU MLP. Llama 2's 34B and 70B models and every Llama 3 model use <strong>grouped-query attention</strong>: many query heads share fewer key/value heads, cutting the KV-cache from <a href="#ch12">Chapter 12</a> by that ratio.</li>
      <li><strong>Mixture of Experts</strong> replaces each MLP with several expert MLPs and a router that sends each token to a few of them: 2 of 8 in Mixtral, 8 of 256 in DeepSeek-V3. Total parameters grow while compute per token stays flat.</li></ul></div>
    ${codeBlock({ file: "llama_parts.py", note: "Drop-in replacements to turn model.py into a small Llama. RoPE is applied to q and k inside attention, and wpe is deleted.", src: llama })}</section>
  <section class="stack" style="gap:14px"><h2 class="sec-label">Multimodal: images, audio, video</h2>
    <div class="prose"><p>Every modality reduces to the same move as text: turn it into a sequence. Images become VQ-VAE or VQGAN tokens (<a href="#ch17">Chapter 17</a>; VQGAN adds an adversarial loss for sharper reconstructions) or continuous patches for a diffusion transformer. Audio becomes codec tokens from a neural audio codec. Video is images over time, typically compressed into space-time patches.</p></div></section>
  </div>`;
}
