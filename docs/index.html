chapter({
  n: 9, slug: "precision", title: "Need for Speed II: Precision", topics: "fp32, fp16, bf16, fp8, mixed precision, autocast, loss scaling", depth: "full", widget: "floatbits",
  idea: `<p><strong>Fewer bits per number means less memory traffic and faster math, as long as you keep enough range.</strong> A float is sign, exponent (range) and mantissa (precision). The formats trade one against the other:</p>
<ul><li><strong>fp32</strong>: 8 exponent bits, 23 mantissa. The safe default.</li>
<li><strong>fp16</strong>: 5 exponent, 10 mantissa. Precise, but its largest value is 65,504 and tiny gradients round to zero. Training in fp16 needs <strong>loss scaling</strong>: multiply the loss by a large factor before backward so gradients stay representable, divide them back before the optimizer step, and skip any step where something overflowed. <code>GradScaler</code> automates all three.</li>
<li><strong>bf16</strong>: 8 exponent, 7 mantissa. The same range as fp32 with coarse precision. Training tolerates the coarseness, so no loss scaling. This is the modern default.</li>
<li><strong>fp8</strong>: E4M3 (max 448) for weights and activations, E5M2 for gradients, on recent NVIDIA GPUs. With only 3 mantissa bits, every tensor needs its own scale factor to use the range well.</li></ul>
<p><strong>Mixed precision</strong> keeps the master weights and optimizer state in fp32 and runs the matmuls in bf16 through <code>torch.autocast</code>. The reason is experiment 2 in <code>precision.py</code>: in bf16, 1.0 + 0.0001 rounds back to 1.0, so small optimizer updates disappear. At 12M parameters fp32 is fine on a Mac; the payoff grows with model size.</p>`,
  code: [{ file: "precision.py", note: "Four experiments: range, precision, fp8 scaling, and the same small model trained four ways.", src: "\"\"\"Four experiments on number formats (Chapter 9). Runs on CPU in about a minute.\n\n  python precision.py\n\"\"\"\nimport torch\nfrom model import GPT, GPTConfig\n\ntorch.manual_seed(0)\nprint(\"1. RANGE: what each format can hold\")\nfor name, dt in [(\"fp32\", torch.float32), (\"fp16\", torch.float16), (\"bf16\", torch.bfloat16),\n                 (\"fp8 e4m3\", torch.float8_e4m3fn), (\"fp8 e5m2\", torch.float8_e5m2)]:\n    fi = torch.finfo(dt)\n    print(f\"   {name:9s} max {fi.max:<12.4g} smallest normal {fi.tiny:<10.3g} step at 1.0: {fi.eps:.3g}\")\ng = torch.tensor([1e-8, 3e-7, 70000.0])\nprint(f\"   gradients {g.tolist()} in fp16 -> {g.half().float().tolist()}  (lost, coarse, overflow)\")\nprint(f\"   same values in bf16 -> {g.bfloat16().float().tolist()}\")\n\nprint(\"\\n2. PRECISION: why the master weights stay in fp32\")\nfor name, dt in [(\"fp32\", torch.float32), (\"bf16\", torch.bfloat16)]:\n    w = torch.tensor(1.0, dtype=dt)\n    for _ in range(1000):\n        w = w + torch.tensor(1e-4, dtype=dt)      # a typical lr * grad update\n    print(f\"   {name}: 1.0 plus 1,000 updates of 1e-4 = {w.item():.4f}  (should be 1.1000)\")\n\nprint(\"\\n3. FP8 MATMUL: scaling decides whether fp8 works\")\na, b = torch.randn(256, 256) * 0.003, torch.randn(256, 256) * 0.003  # small values, like real activations\nref = a @ b\ndef fp8_mm(a, b, scaled):\n    sa = a.abs().max() / 448 if scaled else torch.tensor(1.0)        # 448 = largest e4m3 value\n    sb = b.abs().max() / 448 if scaled else torch.tensor(1.0)\n    qa, qb = (a / sa).to(torch.float8_e4m3fn), (b / sb).to(torch.float8_e4m3fn)\n    return (qa.float() @ qb.float()) * sa * sb                        # real kernels fuse this\nfor scaled in (False, True):\n    out = fp8_mm(a, b, scaled)\n    rel = ((out - ref).norm() / ref.norm()).item()\n    print(f\"   e4m3 {'with' if scaled else 'without'} per-tensor scaling: relative error {rel:.3f}\")\n\nprint(\"\\n4. TRAINING: 150 steps of a small GPT on a fixed synthetic task, four ways\")\ncfg = GPTConfig(vocab_size=64, block_size=32, n_layer=2, n_head=2, n_embd=64)\ndata = torch.randint(0, 64, (512, 33))\ndata[:, 1::2] = (data[:, 0::2][:, :16] * 7 + 3) % 64                  # every odd token is predictable\ndef train(mode):\n    torch.manual_seed(0)\n    model = GPT(cfg)\n    if mode == \"pure bf16\":\n        model = model.to(torch.bfloat16)                               # weights and Adam state in bf16\n    opt = torch.optim.AdamW(model.parameters(), lr=3e-4)\n    scaler = torch.amp.GradScaler(\"cpu\") if mode == \"fp16 + scaler\" else None\n    amp = {\"bf16 autocast\": torch.bfloat16, \"fp16 + scaler\": torch.float16}.get(mode)\n    for step in range(150):\n        batch = data[torch.randint(0, 512, (32,))]\n        x, y = batch[:, :-1], batch[:, 1:]\n        with torch.autocast(\"cpu\", dtype=amp, enabled=amp is not None):\n            _, loss = model(x, y)\n        opt.zero_grad()\n        if scaler:\n            scaler.scale(loss).backward(); scaler.step(opt); scaler.update()\n        else:\n            loss.backward(); opt.step()\n    return loss.float().item()\nfor mode in [\"fp32\", \"bf16 autocast\", \"fp16 + scaler\", \"pure bf16\"]:\n    print(f\"   {mode:14s} final loss {train(mode):.3f}\")\nprint(\"   Autocast keeps fp32 master weights, so it tracks fp32. Pure bf16 loses small updates (experiment 2).\")" },
    { file: "train.py (precision lines)", note: "How the final train.py uses these ideas. The full file is in Chapter 10.", src: R`amp_dtype = {"fp32": None, "bf16": torch.bfloat16, "fp16": torch.float16}[args.dtype]
autocast = torch.autocast(device_type=dev_type, dtype=amp_dtype) if amp_dtype else contextlib.nullcontext()
scaler = torch.amp.GradScaler(dev_type) if args.dtype == "fp16" else None

# inside each step
with autocast:
    _, loss = model(x, y)                # matmuls in bf16/fp16, LayerNorm and loss kept in fp32
(scaler.scale(loss) if scaler else loss).backward()
if scaler:
    scaler.unscale_(opt)                 # back to true gradient scale before clipping
norm = torch.nn.utils.clip_grad_norm_(raw.parameters(), 1.0)
if scaler:
    scaler.step(opt)                     # skips the step if any gradient is inf or nan
    scaler.update()
else:
    opt.step()` }],
  run: R`python precision.py`,
  expect: `Experiment 1: in fp16, 1e-8 becomes 0, 3e-7 becomes 2.98e-7, and 70,000 becomes inf; bf16 keeps all three. Experiment 2: fp32 reaches 1.1000, bf16 stays at 1.0000. Experiment 3: e4m3 error drops from about 27% to about 4% with scaling. Experiment 4: fp32, bf16 autocast and fp16 with a scaler finish at the same loss; pure bf16 finishes higher. Chapter 10's final <code>train.py</code> puts this into practice with <code>--dtype bf16</code>.`,
  checks: [["Why does bf16 not need loss scaling but fp16 does?", "bf16 keeps fp32's 8 exponent bits, so tiny gradients stay representable. fp16 loses them below about 6e-8, so you scale the loss up before backward and the gradients down after."],
    ["Why does GradScaler unscale before clip_grad_norm_?", "Clipping compares the gradient norm with 1.0. On scaled gradients the norm is thousands of times too large and clipping would crush every step."],
    ["Under autocast, where do the fp32 master weights live?", "In the model's parameters themselves, which stay fp32. Autocast casts a bf16 copy on the fly for each matmul, so updates land in fp32 and are never rounded away."],
    ["Type 70000 into the explorer. What happens in each format?", "fp16 overflows to infinity (max 65,504). bf16 rounds to 70,144. Both fp8 formats overflow. e4m3 (max 448) has no infinity, so PyTorch clamps it to 448, a 99% error; e5m2 (max 57,344) becomes infinity. That is why fp8 always travels with a per-tensor scale."]]
});

chapter({
  n: 10, slug: "distributed", title: "Need for Speed III: Distributed", topics: "data parallel (DDP), all-reduce, gradient accumulation, ZeRO, FSDP", depth: "full", widget: "zero",
  idea: `<p><strong>Distributed training splits the data, then splits the memory.</strong></p>
<ul><li><strong>DDP</strong> (distributed data parallel): every GPU holds a full copy of the model and gets a different slice of each batch. After backward, an <strong>all-reduce</strong> averages the gradients so every copy takes the identical step. A ring all-reduce sends each GPU about twice the gradient size no matter how many GPUs there are, which is why DDP scales well.</li>
<li><strong>Gradient accumulation</strong> runs several small forward and backward passes before one optimizer step. It gives you a large batch on limited memory. Under DDP, skip the all-reduce on every micro-step but the last (<code>model.no_sync()</code>).</li>
<li><strong>The memory wall.</strong> Each GPU stores weights, gradients and Adam state, about 16 bytes per parameter in mixed precision. A 7B model needs 112 GB before activations. ZeRO removes the duplication in stages: stage 1 shards the optimizer state, stage 2 the gradients too, stage 3 the weights as well, gathering each layer's weights just before it runs. PyTorch calls stage 3 FSDP.</li></ul>
<p>Mac note: the Apple GPU can't be shared across processes for DDP, so these scripts run as CPU processes with the <code>gloo</code> backend. You learn the exact mechanics; the speedup arrives on a multi-GPU machine, where the same files run with <code>nccl</code> and <code>cuda</code> automatically.</p>
<p>The final <code>train.py</code> below replaces Chapter 7's. It adds the precision flag from Chapter 9, gradient accumulation, DDP, and reads the vocabulary size from your tokenizer.</p>`,
  code: [{ file: "ddp_demo.py", note: "The smallest DDP program: two processes, two data shards, one synchronized model.", src: "import torch, torch.distributed as dist\nfrom torch.nn.parallel import DistributedDataParallel as DDP\nfrom model import GPT, GPTConfig\n\ndist.init_process_group(\"gloo\")                  # CPU backend; use \"nccl\" on NVIDIA\nrank, world = dist.get_rank(), dist.get_world_size()\ntorch.manual_seed(0)\nmodel = DDP(GPT(GPTConfig(n_layer=2, n_head=4, n_embd=128)))   # broadcasts rank 0's weights\nopt = torch.optim.AdamW(model.parameters(), lr=1e-3)\n\nfor step in range(20):\n    g = torch.Generator().manual_seed(step * world + rank)       # different data per rank\n    seq = torch.randint(0, 4096, (8, 65), generator=g)\n    x, y = seq[:, :-1], seq[:, 1:]                               # next-token targets\n    _, loss = model(x, y)\n    opt.zero_grad(); loss.backward(); opt.step()                # backward all-reduces grads\n    if rank == 0 and step % 5 == 0:\n        print(f\"step {step} loss {loss.item():.3f}\")\n\nflat = torch.nn.utils.parameters_to_vector(model.parameters()).detach()   # every weight\nmx, mn = flat.clone(), flat.clone()\ndist.all_reduce(mx, op=dist.ReduceOp.MAX)\ndist.all_reduce(mn, op=dist.ReduceOp.MIN)\nif rank == 0:\n    print(\"replicas identical:\", torch.equal(mx, mn))\ndist.destroy_process_group()" },
    { file: "train.py", note: "The final pretraining script: one device or many, any precision.", src: "\"\"\"Pretrain the Storyteller GPT. Chapters 7 (loop), 9 (precision) and 10 (distributed).\n\n  python train.py                                   # one device: MPS on a Mac, else CPU\n  python train.py --dtype bf16                      # mixed precision (Chapter 9)\n  torchrun --nproc_per_node=2 train.py --device cpu # data parallel (Chapter 10)\n\"\"\"\nimport argparse, contextlib, math, os, time\nimport numpy as np, torch\nimport torch.distributed as dist\nfrom torch.nn.parallel import DistributedDataParallel as DDP\nfrom model import GPT, GPTConfig\nfrom bpe import BPETokenizer\n\np = argparse.ArgumentParser()\np.add_argument(\"--device\", default=\"auto\")\np.add_argument(\"--dtype\", default=\"fp32\", choices=[\"fp32\", \"bf16\", \"fp16\"])\np.add_argument(\"--batch_size\", type=int, default=32)      # per process, per micro-step\np.add_argument(\"--block_size\", type=int, default=256)\np.add_argument(\"--grad_accum\", type=int, default=1)       # micro-steps per optimizer step\np.add_argument(\"--max_steps\", type=int, default=5000)\np.add_argument(\"--warmup\", type=int, default=200)\np.add_argument(\"--max_lr\", type=float, default=1e-3)\np.add_argument(\"--eval_every\", type=int, default=250)\np.add_argument(\"--n_layer\", type=int, default=6)\np.add_argument(\"--n_head\", type=int, default=6)\np.add_argument(\"--n_embd\", type=int, default=384)\np.add_argument(\"--out\", default=\"ckpt.pt\")\nargs = p.parse_args()\n\n# ---- distributed setup (Chapter 10). torchrun sets RANK, WORLD_SIZE, LOCAL_RANK ----\nddp = \"RANK\" in os.environ\nif ddp:\n    dist.init_process_group(\"nccl\" if torch.cuda.is_available() else \"gloo\")\n    rank, world, local = dist.get_rank(), dist.get_world_size(), int(os.environ[\"LOCAL_RANK\"])\nelse:\n    rank, world, local = 0, 1, 0\nmaster = rank == 0\n\nif args.device == \"auto\":\n    if torch.cuda.is_available():\n        device = f\"cuda:{local}\"\n    elif torch.backends.mps.is_available() and not ddp:\n        device = \"mps\"\n    else:\n        device = \"cpu\"\nelse:\n    device = args.device\ndev_type = device.split(\":\")[0]\nif dev_type == \"cuda\":\n    torch.cuda.set_device(device)\n\ntorch.manual_seed(1337)               # identical init on every rank\nnp.random.seed(1337 + rank)           # different batches on every rank\n\n# ---- precision (Chapter 9) ----\namp_dtype = {\"fp32\": None, \"bf16\": torch.bfloat16, \"fp16\": torch.float16}[args.dtype]\nautocast = torch.autocast(device_type=dev_type, dtype=amp_dtype) if amp_dtype else contextlib.nullcontext()\nscaler = torch.amp.GradScaler(dev_type) if args.dtype == \"fp16\" else None    # fp16 needs loss scaling\n\nB, T = args.batch_size, args.block_size\ntrain = np.memmap(\"train.bin\", dtype=np.uint16, mode=\"r\")\nval = np.memmap(\"val.bin\", dtype=np.uint16, mode=\"r\")\n\ndef get_batch(split):\n    d = train if split == \"train\" else val\n    ix = np.random.randint(0, len(d) - T - 1, B)\n    x = torch.stack([torch.from_numpy(d[i:i + T].astype(np.int64)) for i in ix])\n    y = torch.stack([torch.from_numpy(d[i + 1:i + 1 + T].astype(np.int64)) for i in ix])\n    return x.to(device), y.to(device)\n\ndef lr_at(step):\n    min_lr = args.max_lr / 10\n    if step < args.warmup:\n        return args.max_lr * (step + 1) / args.warmup\n    p = (step - args.warmup) / max(1, args.max_steps - args.warmup)\n    return min_lr + 0.5 * (args.max_lr - min_lr) * (1 + math.cos(math.pi * p))\n\nvocab_size = len(BPETokenizer().load(\"tok.pkl\").vocab)      # 4,096 with the Chapter 6 tokenizer\ncfg = GPTConfig(vocab_size=vocab_size, block_size=T, n_layer=args.n_layer, n_head=args.n_head, n_embd=args.n_embd)\nraw = GPT(cfg).to(device)\nmodel = DDP(raw) if ddp else raw\ndecay = [p for p in raw.parameters() if p.dim() >= 2]\nno_decay = [p for p in raw.parameters() if p.dim() < 2]\nopt = torch.optim.AdamW([{\"params\": decay, \"weight_decay\": 0.1},\n                         {\"params\": no_decay, \"weight_decay\": 0.0}],\n                        lr=args.max_lr, betas=(0.9, 0.95), eps=1e-8)\n\n@torch.no_grad()\ndef val_loss(iters=20):\n    raw.eval()\n    tot = 0.0\n    for _ in range(iters):\n        with autocast:\n            tot += raw(*get_batch(\"val\"))[1].item()\n    raw.train()\n    return tot / iters\n\nif master:\n    n = sum(p.numel() for p in raw.parameters())\n    print(f\"{n / 1e6:.2f}M params | {device} | {args.dtype} | {world} process(es) | \"\n          f\"{B * T * args.grad_accum * world:,} tokens per step\")\n\nt_start, last_val = time.time(), None\nfor step in range(args.max_steps):\n    t0 = time.time()\n    for g in opt.param_groups:\n        g[\"lr\"] = lr_at(step)\n    opt.zero_grad(set_to_none=True)\n    loss_sum = torch.zeros((), device=device)\n    for micro in range(args.grad_accum):\n        x, y = get_batch(\"train\")\n        sync = (not ddp) or micro == args.grad_accum - 1      # all-reduce only on the last micro-step\n        with (contextlib.nullcontext() if sync else model.no_sync()):\n            with autocast:\n                _, loss = model(x, y)\n            loss = loss / args.grad_accum\n            (scaler.scale(loss) if scaler else loss).backward()\n        loss_sum += loss.detach()\n    if ddp:\n        dist.all_reduce(loss_sum)\n        loss_sum /= world\n    if scaler:\n        scaler.unscale_(opt)                 # back to true gradient scale before clipping\n    norm = torch.nn.utils.clip_grad_norm_(raw.parameters(), 1.0)\n    if scaler:\n        scaler.step(opt)                     # skips the step if any gradient is inf or nan\n        scaler.update()\n    else:\n        opt.step()\n    if master and step % 50 == 0:\n        lv = loss_sum.item()                 # forces the device to finish before timing\n        dt = time.time() - t0\n        print(f\"step {step:5d} | loss {lv:.3f} | norm {norm:.2f} | lr {lr_at(step):.1e} | \"\n              f\"{B * T * args.grad_accum * world / dt:,.0f} tok/s\")\n    if master and (step % args.eval_every == 0 or step == args.max_steps - 1):\n        last_val = val_loss()\n        print(f\"           val {last_val:.3f}\")\n        run = {**vars(args), \"script\": \"train.py\", \"steps_done\": step + 1, \"world_size\": world, \"device\": device,\n               \"tokens_seen\": (step + 1) * B * T * args.grad_accum * world,\n               \"seconds\": round(time.time() - t_start, 1), \"val_loss\": round(last_val, 4)}\n        torch.save({\"model\": raw.state_dict(), \"cfg\": vars(cfg), \"train\": run}, args.out)\n\nif ddp:\n    dist.destroy_process_group()" },
    { file: "zero1.py", note: "ZeRO stage 1 written by hand, checked against plain AdamW.", src: "\"\"\"ZeRO stage 1 by hand (Chapter 10). Each rank keeps AdamW state for only its slice of the\nparameters, updates that slice, then all-gathers the slices so every rank has the full model.\nRank 0 also trains an ordinary AdamW copy on the whole batch and checks the two agree.\n\n  torchrun --nproc_per_node=2 zero1.py\n\"\"\"\nimport torch, torch.distributed as dist\nfrom model import GPT, GPTConfig\n\ndist.init_process_group(\"gloo\")                  # \"nccl\" on NVIDIA GPUs\nrank, world = dist.get_rank(), dist.get_world_size()\ntorch.manual_seed(0)\ncfg = GPTConfig(vocab_size=512, block_size=64, n_layer=2, n_head=4, n_embd=128)\nmodel = GPT(cfg)                                 # same seed, so the same init on every rank\nparams = list(model.parameters())                # tied wte/lm_head appears once\nn = sum(p.numel() for p in params)\nshard = (n + world - 1) // world                 # pad so every rank owns an equal slice\nlo, hi = rank * shard, min(n, (rank + 1) * shard)\n\nflat = torch.nn.utils.parameters_to_vector(params).detach()\nmaster = flat[lo:hi].clone()                     # this rank's slice of the weights\nm, v = torch.zeros_like(master), torch.zeros_like(master)   # Adam state: only for this slice\nlr, b1, b2, eps, wd = 1e-3, 0.9, 0.95, 1e-8, 0.1\n\nif rank == 0:                                    # reference: plain AdamW, full batch, one process\n    ref = GPT(cfg); ref.load_state_dict(model.state_dict())\n    ref_opt = torch.optim.AdamW(ref.parameters(), lr=lr, betas=(b1, b2), eps=eps, weight_decay=wd)\n\ndef global_batch(step, B=8, T=64):\n    g = torch.Generator().manual_seed(step)\n    x = torch.randint(0, cfg.vocab_size, (B, T + 1), generator=g)\n    return x[:, :-1], x[:, 1:]\n\nfor step in range(1, 21):\n    x, y = global_batch(step % 4)                            # 4 batches on repeat, so loss falls\n    _, loss = model(x[rank::world], y[rank::world])          # each rank: its share of the batch\n    model.zero_grad()\n    loss.backward()\n    g = torch.cat([p.grad.view(-1) for p in params])\n    dist.all_reduce(g)                                       # NCCL would use reduce_scatter and send\n    g = g[lo:hi] / world                                     # each rank only the slice it owns\n\n    master.mul_(1 - lr * wd)                                 # AdamW on this slice only\n    m.mul_(b1).add_(g, alpha=1 - b1)\n    v.mul_(b2).addcmul_(g, g, value=1 - b2)\n    master.addcdiv_(m / (1 - b1 ** step), (v / (1 - b2 ** step)).sqrt() + eps, value=-lr)\n\n    piece = torch.zeros(shard); piece[:hi - lo] = master\n    parts = [torch.zeros(shard) for _ in range(world)]\n    dist.all_gather(parts, piece)                            # everyone gets everyone's slice\n    torch.nn.utils.vector_to_parameters(torch.cat(parts)[:n], params)\n\n    if rank == 0:\n        _, ref_loss = ref(x, y)\n        ref_opt.zero_grad(); ref_loss.backward(); ref_opt.step()\n        if step % 5 == 0:\n            print(f\"step {step:2d}  loss {ref_loss.item():.4f}\")\n\nif rank == 0:\n    diff = (torch.nn.utils.parameters_to_vector(params) - torch.nn.utils.parameters_to_vector(ref.parameters())).abs().max()\n    print(f\"max |ZeRO-1 weights - AdamW weights| = {diff.item():.1e}\")\n    print(f\"Adam state per rank: {2 * shard * 4 / 1e6:.2f} MB with ZeRO-1 vs {2 * n * 4 / 1e6:.2f} MB without\")\ndist.destroy_process_group()" },
    { file: "fsdp_demo.py", note: "ZeRO stage 3 with PyTorch's FSDP: two lines turn sharding on.", src: "\"\"\"ZeRO stage 3 with PyTorch FSDP (Chapter 10). Every weight is split across ranks and\ngathered just in time for each block's forward and backward.\n\n  torchrun --nproc_per_node=2 fsdp_demo.py\n\"\"\"\nimport torch, torch.distributed as dist\nfrom torch.distributed.fsdp import fully_shard\nfrom torch.distributed.device_mesh import init_device_mesh\nfrom model import GPT, GPTConfig\n\ndist.init_process_group(\"gloo\")                  # \"nccl\" on NVIDIA GPUs\nrank = dist.get_rank()\n# An explicit CPU mesh: left to itself, fully_shard picks mps on a Mac and crashes in torch 2.8\nmesh = init_device_mesh(\"cpu\", (dist.get_world_size(),))\ntorch.manual_seed(0)\nmodel = GPT(GPTConfig(vocab_size=512, block_size=64, n_layer=2, n_head=4, n_embd=128))\nfor block in model.blocks:\n    fully_shard(block, mesh=mesh)                # each block gathers its own weights when needed\nfully_shard(model, mesh=mesh)                    # embeddings and final norm\nopt = torch.optim.AdamW(model.parameters(), lr=1e-3)   # optimizer state is sharded too\n\ng = torch.Generator().manual_seed(rank)\nx = torch.randint(0, 512, (4, 65), generator=g)  # a fixed batch per rank, so loss should fall\nfor step in range(30):\n    _, loss = model(x[:, :-1], x[:, 1:])\n    opt.zero_grad(); loss.backward(); opt.step()\n    if rank == 0 and step % 10 == 0:\n        print(f\"step {step:2d}  loss {loss.item():.3f}\")\n\nw = model.wte.weight\nprint(f\"rank {rank}: wte is {tuple(w.shape)} logically, this rank stores {tuple(w.to_local().shape)}\")\ndist.destroy_process_group()" }],
  run: R`torchrun --nproc_per_node=2 ddp_demo.py
torchrun --nproc_per_node=2 train.py --device cpu --max_steps 200 --grad_accum 2
torchrun --nproc_per_node=2 zero1.py
torchrun --nproc_per_node=4 zero1.py
torchrun --nproc_per_node=2 fsdp_demo.py`,
  expect: `<code>replicas identical: True</code>. <code>train.py</code> reports 2 processes and twice the tokens per step. <code>zero1.py</code> shows loss falling, weights within about 1e-5 of plain AdamW, and Adam state per rank halved (quartered with 4 processes). <code>fsdp_demo.py</code> shows loss falling while each rank stores only half of the 512 × 128 embedding.`,
  checks: [["DDP on 8 GPUs: what happens to the effective batch size?", "It multiplies by 8. Either scale the learning rate with it or shrink the per-GPU batch to keep the global batch fixed."],
    ["Why skip the all-reduce on all but the last micro-step?", "Gradients accumulate locally either way. One all-reduce of the sum moves the same result with a fraction of the communication."],
    ["zero1.py differs from AdamW by about 1e-5, not 0. Is that a bug?", "No. Summing gradients in a different order rounds differently, and Adam divides by the square root of tiny second moments in early steps, which magnifies those differences slightly."],
    ["Why does ZeRO-3 cost more communication than DDP?", "Weights are sharded, so each layer's weights are gathered before its forward and again before its backward, on top of the gradient reduction."]]
});

chapter({
  n: 11, slug: "datasets", title: "Datasets", topics: "data quality, memmap loading, packing, train/val splits, synthetic data", depth: "full", widget: "packing",
  idea: `<p><strong>The data defines the model.</strong> TinyStories exists because Eldan and Li (2023) asked a question: how small can a model be and still write fluent English? Their answer was to shrink the world, not the model. They had GPT-3.5 and GPT-4 write millions of stories using vocabulary a 3 to 4 year old knows. That is synthetic data generation, and it is why a 12M model can write coherent stories here.</p>
<ul><li><strong>Loading.</strong> Our token file is one long array. <code>np.memmap</code> reads slices from disk on demand, so 100M tokens or 100B tokens use the same code.</li>
<li><strong>Packing.</strong> Stories are concatenated with <code>&lt;|endoftext|&gt;</code> between them and sliced into fixed windows. No compute is wasted on padding. The lab shows the difference.</li>
<li><strong>Validation split.</strong> Always measure on stories the model never trained on. Train loss falling while val loss rises means memorization.</li>
<li><strong>Synthetic instruction data.</strong> For chat (Chapter 14) we need prompt and response pairs. The script below builds them from existing stories by pairing each story with a request it actually satisfies. No API calls needed.</li></ul>`,
  code: [{ file: "make_sft.py", note: "Turns stories into instruction pairs. Each pair records the topic word so Chapter 15 can build preference data from it.", src: "import json, random, re\nfrom datasets import load_dataset\n\nrandom.seed(0)\nds = load_dataset(\"roneneldan/TinyStories\", split=\"train[:60000]\")\ntemplates = [\"Write a short story about a {w}.\",\n             \"Tell me a bedtime story with a {w} in it.\",\n             \"Can you make up a story about a {w}?\",\n             \"I want a happy story about a {w}.\"]\ntopics = [\"dog\", \"cat\", \"ball\", \"tree\", \"bird\", \"fish\", \"car\", \"cake\", \"boat\", \"flower\",\n          \"dragon\", \"star\", \"moon\", \"bear\", \"frog\", \"train\", \"kite\", \"rabbit\", \"princess\", \"robot\"]\n\nout = []\nfor story in ds[\"text\"]:\n    words = set(re.findall(r\"[a-z]+\", story.lower()))\n    hits = [w for w in topics if w in words]\n    if hits and len(story) < 900:\n        w = random.choice(hits)\n        out.append({\"prompt\": random.choice(templates).format(w=w), \"response\": story.strip(), \"word\": w})\n\nrandom.shuffle(out)\njson.dump(out, open(\"sft.json\", \"w\"))\nprint(f\"{len(out):,} pairs. Example:\\n{out[0]['prompt']}\\n{out[0]['response'][:200]}...\")" }],
  run: R`python make_sft.py`,
  expect: `Tens of thousands of pairs, each with a prompt naming a topic and a story that really contains it.`,
  checks: [["get_batch picks random windows that may start mid-story. Is that a problem?", "No. Every window teaches next-token prediction from whatever context is present, and the EOT token teaches the model where stories end and begin."],
    ["What is the risk of training mostly on synthetic data from a bigger model?", "Your model inherits that model's style, blind spots and errors, and diversity can collapse if the generator repeats itself. TinyStories fought this by randomizing required words and features in each prompt."]]
});

chapter({
  n: 12, slug: "kv-cache", title: "Inference I: KV-Cache", topics: "autoregressive decoding cost, key/value caching, prefill vs decode", depth: "full", widget: "kvcache",
  idea: `<p><strong>Generation repeats work unless you cache it.</strong> <code>generate()</code> in Chapter 5 re-runs the whole sequence through every layer for each new token. But the keys and values of old tokens never change, because of the causal mask. Store them, and each step only computes the newest token.</p>
<ul><li><strong>Prefill.</strong> Run the prompt once, in parallel, and keep each layer's K and V.</li>
<li><strong>Decode.</strong> Feed one token at a time. Its query attends to all cached keys, then its own K and V are appended.</li>
<li>The cost moves from compute to memory: the cache holds <code>2 × layers × n_embd × tokens</code> numbers per sequence. At large scale, cache memory is what limits batch size. Grouped-query attention (Llama, see Appendix) shrinks it.</li></ul>
<p>Mask detail: during decode there is a single query and every cached key is in the past, so no causal mask is applied.</p>`,
  code: [{ file: "model.py (patch)", note: "Replace CausalSelfAttention.forward and Block.forward, change one line in GPT.forward, and add generate_cached to GPT.", src: R`# CausalSelfAttention
    def forward(self, x, past=None):
        B, T, C = x.shape
        q, k, v = self.qkv(x).split(C, dim=2)
        q, k, v = [t.view(B, T, self.n_head, C // self.n_head).transpose(1, 2) for t in (q, k, v)]
        if past is not None:                                  # append to the cache
            k = torch.cat([past[0], k], dim=2)
            v = torch.cat([past[1], v], dim=2)
        y = F.scaled_dot_product_attention(q, k, v, is_causal=past is None)
        y = y.transpose(1, 2).contiguous().view(B, T, C)
        return self.proj(y), (k, v)

# Block
    def forward(self, x, past=None):
        a, present = self.attn(self.ln_1(x), past)
        x = x + a
        x = x + self.mlp(self.ln_2(x))
        return x, present

# GPT.forward: the loop becomes
        for block in self.blocks:
            x, _ = block(x)

# GPT: new method
    @torch.no_grad()
    def generate_cached(self, idx, max_new_tokens, temperature=1.0, top_k=None):
        pasts, x_in, pos0 = [None] * len(self.blocks), idx, 0
        for _ in range(max_new_tokens):
            T = x_in.size(1)
            if pos0 + T > self.cfg.block_size:        # learned positions end here
                break
            x = self.wte(x_in) + self.wpe(torch.arange(pos0, pos0 + T, device=idx.device))
            for i, block in enumerate(self.blocks):
                x, pasts[i] = block(x, pasts[i])
            logits = self.lm_head(self.ln_f(x[:, -1, :])) / temperature
            if top_k is not None:
                v, _ = torch.topk(logits, top_k)
                logits[logits < v[:, [-1]]] = -float("inf")
            nxt = torch.multinomial(F.softmax(logits, dim=-1), 1)
            idx = torch.cat([idx, nxt], dim=1)
            pos0, x_in = pos0 + T, nxt
        return idx` },
  { file: "bench_kv.py", note: "Compare tokens per second with and without the cache.", src: "import time, torch\nfrom model import GPT, GPTConfig\nfrom device import pick_device, synchronize\n\ndevice = pick_device()\nck = torch.load(\"ckpt.pt\", map_location=device)\nmodel = GPT(GPTConfig(**ck[\"cfg\"])).to(device).eval()\nmodel.load_state_dict(ck[\"model\"])\nidx = torch.zeros((1, 8), dtype=torch.long, device=device)\n\nfor name, fn in [(\"no cache\", model.generate), (\"kv-cache\", model.generate_cached)]:\n    torch.manual_seed(0); t = time.time()\n    out = fn(idx, 240, top_k=50)\n    synchronize(device)\n    n = out.size(1) - idx.size(1)                 # the cached version stops at the context limit\n    print(f\"{name:9s} {n / (time.time() - t):6.0f} tok/s  ({n} tokens)\")" }],
  run: R`python bench_kv.py`,
  expect: `kv-cache faster, often 2 to 5× at this size, with the gap widening for longer sequences. At 12M parameters, Python overhead per step limits the speedup; on large models it is far bigger.`,
  checks: [["Why can't you cache queries too?", "Each query is used once: by its own position, at the step it is generated. Keys and values are reread by every later token."],
    ["Why does our cached generate stop at block_size?", "Positions use a learned table with block_size rows. Past that there is no embedding. A sliding window would need recomputing the cache, and RoPE models handle this differently."]]
});

chapter({
  n: 13, slug: "quantization", title: "Inference II: Quantization", topics: "int8 and int4 weights, scales, group-wise quantization, outliers", depth: "full", widget: "quant",
  idea: `<p><strong>Store weights in fewer bits and dequantize on the fly.</strong> Decoding is memory-bound: every new token reads every weight. Shrinking weights from 32 bits to 8 cuts that traffic by 4×.</p>
<ul><li><strong>Symmetric quantization.</strong> For a group of weights, scale = max |w| / 127. Store <code>round(w / scale)</code> as int8 plus one fp32 scale. Reconstruct with <code>q × scale</code>.</li>
<li><strong>Granularity</strong> is the key tradeoff. One scale per whole tensor is cheap but a single outlier stretches the scale and crushes every small weight toward 0. Per-row or per-group-of-32 scales isolate outliers. Turn on outliers in the lab and switch the grouping to see it.</li>
<li><strong>int4</strong> (as in GPTQ, AWQ, llama.cpp's Q4 formats) needs small groups and smarter rounding to hold quality.</li></ul>`,
  code: [{ file: "quantize.py", note: "Per-output-row int8 weight quantization for every Linear layer, then a side-by-side validation loss.", src: "import numpy as np, torch, torch.nn as nn, torch.nn.functional as F\nfrom model import GPT, GPTConfig\n\nclass QLinear(nn.Module):\n    def __init__(self, lin):\n        super().__init__()\n        w = lin.weight.data.float()\n        scale = w.abs().amax(dim=1, keepdim=True).clamp(min=1e-8) / 127.0   # one scale per row\n        self.register_buffer(\"wq\", torch.round(w / scale).clamp(-127, 127).to(torch.int8))\n        self.register_buffer(\"scale\", scale)\n        self.bias = lin.bias\n    def forward(self, x):\n        return F.linear(x, (self.wq.float() * self.scale).to(x.dtype), self.bias)\n\ndef quantize_(module, skip=(\"lm_head\",)):          # lm_head is tied to the embedding\n    for name, child in module.named_children():\n        if isinstance(child, nn.Linear) and name not in skip:\n            setattr(module, name, QLinear(child))\n        else:\n            quantize_(child, skip)\n    return module\n\nval = np.memmap(\"val.bin\", dtype=np.uint16, mode=\"r\")\ndef val_loss(m, n=20, B=16):\n    T = min(256, m.cfg.block_size)                # never longer than the model's context\n    g = np.random.default_rng(0)                   # same batches for both models\n    tot = 0.0\n    with torch.no_grad():\n        for _ in range(n):\n            ix = g.integers(0, len(val) - T - 1, B)\n            x = torch.stack([torch.from_numpy(val[i:i + T].astype(np.int64)) for i in ix])\n            y = torch.stack([torch.from_numpy(val[i + 1:i + 1 + T].astype(np.int64)) for i in ix])\n            tot += m(x, y)[1].item()\n    return tot / n\n\nck = torch.load(\"ckpt.pt\", map_location=\"cpu\")\nmodel = GPT(GPTConfig(**ck[\"cfg\"])).eval()\nmodel.load_state_dict(ck[\"model\"])\nsize = lambda m: sum(t.numel() * t.element_size() for t in list(m.parameters()) + list(m.buffers()))\n\nfp_size, fp_loss = size(model), val_loss(model)\nquantize_(model)\nq_size, q_loss = size(model), val_loss(model)\nprint(f\"fp32: {fp_size / 1e6:5.1f} MB  val {fp_loss:.4f}\")\nprint(f\"int8: {q_size / 1e6:5.1f} MB  val {q_loss:.4f}\")" }],
  run: R`python quantize.py`,
  expect: `Size drops from about 49 MB to roughly 17 MB (the embedding stays fp32). Validation loss changes only in the third decimal place.`,
  checks: [["Why is the token embedding the largest remaining fp32 tensor?", "4,096 × 384 weights, shared with lm_head. Quantizing it is possible but the output layer is sensitive, so many schemes keep it at higher precision."],
    ["This QLinear dequantizes to float every call. Where does the real speedup come from in production?", "Fused kernels that read int8 or int4 weights from memory and dequantize inside the matmul, so the slow memory reads shrink. Our version saves memory but not time."]]
});

chapter({
  n: 14, slug: "sft", title: "Finetuning I: SFT", topics: "supervised finetuning, chat templates, loss masking, LoRA, PEFT", depth: "full", widget: "lora",
  idea: `<p><strong>Pretraining teaches the model to continue text. SFT teaches it to answer.</strong> Same next-token loss, different data: conversations formatted with a chat template.</p>
<ul><li><strong>Chat template.</strong> <code>&lt;|user|&gt;</code> prompt <code>&lt;|assistant|&gt;</code> response <code>&lt;|endoftext|&gt;</code>. At inference you supply everything up to <code>&lt;|assistant|&gt;</code> and let the model write.</li>
<li><strong>Loss masking.</strong> Labels for prompt tokens are set to -100 so cross-entropy ignores them. The model learns to write responses, not to imitate users.</li>
<li><strong>LoRA</strong> (parameter-efficient finetuning). Freeze the base weights W and learn a low-rank update <code>B·A</code> with rank r. Trainable parameters drop to <code>r × (d_in + d_out)</code> per layer. B starts at zero, so training begins exactly at the pretrained model. Afterward, merge <code>W += scale × B·A</code> and the adapter disappears.</li></ul>
<p>The chat tokens never appeared in pretraining, so their embedding rows are still random. We train those three rows and nothing else in the embedding, using a gradient mask. Unfreezing the whole 4,096-row embedding would add 1.57M trainable parameters, 14 times the adapters, and quietly turn LoRA back into a large finetune.</p>`,
  code: [{ file: "sft.py", note: "LoRA finetuning on the pairs from Chapter 11, then merge and save chat.pt for the app.", src: "import argparse, time, json, random, torch, torch.nn as nn\nfrom model import GPT, GPTConfig\nfrom bpe import BPETokenizer\nfrom device import pick_device\n\ndevice = pick_device()\nrandom.seed(0); torch.manual_seed(0)\ntok = BPETokenizer().load(\"tok.pkl\")\nEOT = tok.special[\"<|endoftext|>\"]\np = argparse.ArgumentParser()\np.add_argument(\"--steps\", type=int, default=1500)\nargs = p.parse_args()\nB, T, steps = 16, 256, args.steps\n\nclass LoRALinear(nn.Module):\n    def __init__(self, base, r=8, alpha=16):\n        super().__init__()\n        self.base = base\n        self.A = nn.Parameter(torch.randn(r, base.in_features) * 0.01)\n        self.B = nn.Parameter(torch.zeros(base.out_features, r))   # zero: start at the base model\n        self.scale = alpha / r\n    def forward(self, x):\n        return self.base(x) + (x @ self.A.T @ self.B.T) * self.scale\n\nck = torch.load(\"ckpt.pt\", map_location=device)\nmodel = GPT(GPTConfig(**ck[\"cfg\"])).to(device)\nT = min(T, model.cfg.block_size)                   # never longer than the model's context\nmodel.load_state_dict(ck[\"model\"])\nfor p in model.parameters():\n    p.requires_grad = False\n# The chat tokens never appeared in pretraining, so their embedding rows are untrained. Learn\n# just those rows: a gradient mask zeroes every other row of the (tied) embedding.\nmodel.wte.weight.requires_grad = True\nchat_rows = torch.zeros(model.cfg.vocab_size, 1, device=device)\nchat_rows[list(tok.special.values())] = 1.0\nmodel.wte.weight.register_hook(lambda g: g * chat_rows)\nfor blk in model.blocks:\n    blk.attn.qkv = LoRALinear(blk.attn.qkv).to(device)\n    blk.attn.proj = LoRALinear(blk.attn.proj).to(device)\ntrainable = [p for p in model.parameters() if p.requires_grad]\nn_lora = sum(p.numel() for n, p in model.named_parameters() if p.requires_grad and n != \"wte.weight\")\nn_emb = len(tok.special) * model.cfg.n_embd\nprint(f\"trainable {n_lora + n_emb:,} of {sum(p.numel() for p in model.parameters()):,} \"\n      f\"({n_lora:,} in LoRA adapters, {n_emb:,} in the chat-token embeddings)\")\n\ndata = json.load(open(\"sft.json\"))\ndef encode(ex):\n    p = tok.encode(f\"<|user|>{ex['prompt']}<|assistant|>\")\n    r = tok.encode_ordinary(ex[\"response\"]) + [EOT]\n    ids = (p + r)[:T + 1]\n    lab = ([-100] * len(p) + r)[:T + 1]              # no loss on the prompt\n    x, y = ids[:-1], lab[1:]\n    return x + [EOT] * (T - len(x)), y + [-100] * (T - len(y))\n\ndef get_batch():\n    xs, ys = zip(*(encode(ex) for ex in random.sample(data, B)))\n    return torch.tensor(xs, device=device), torch.tensor(ys, device=device)\n\nopt = torch.optim.AdamW(trainable, lr=1e-3, weight_decay=0.0)\nt_start = time.time()\nfor step in range(steps):\n    x, y = get_batch()\n    _, loss = model(x, y)\n    opt.zero_grad(); loss.backward(); opt.step()\n    if step % 100 == 0:\n        print(f\"step {step:4d}  loss {loss.item():.3f}\")\n\nwith torch.no_grad():                                   # merge adapters into W\n    for blk in model.blocks:\n        for name in (\"qkv\", \"proj\"):\n            l = getattr(blk.attn, name)\n            l.base.weight += l.scale * (l.B @ l.A)\n            setattr(blk.attn, name, l.base)\ntorch.save({\"model\": model.state_dict(), \"cfg\": ck[\"cfg\"],\n            \"train\": {**vars(args), \"script\": \"sft.py\", \"from\": \"ckpt.pt\", \"seconds\": round(time.time() - t_start, 1)}}, \"chat.pt\")\n\nmodel.eval()\nidx = torch.tensor([tok.encode(\"<|user|>Tell me a bedtime story with a dragon in it.<|assistant|>\")], device=device)\nout = model.generate(idx, 200, temperature=0.8, top_k=50)[0].tolist()\nprint(tok.decode(out).split(\"<|assistant|>\")[1].split(\"<|endoftext|>\")[0])" }],
  run: R`python sft.py`,
  expect: `<code>trainable 111,744 of 12,429,312</code>: 110,592 in the LoRA adapters plus 1,152 for the three chat-token rows, under 1% of the model. Loss settles near the pretraining loss. The final sample answers the request with a story that includes the dragon.`,
  checks: [["Why is LoRA's B initialized to zero rather than A?", "One of the two must be zero so that B·A = 0 and training starts exactly at the pretrained model. Either choice still trains: with A = 0, A gets gradient through B, and B starts learning one step later. Zeroing B with a small random A is the convention from the LoRA paper and tends to train a little better."],
    ["What goes wrong if you skip loss masking?", "The model spends capacity learning to predict user prompts. With templated prompts it also gets an easy, misleading loss reduction on the repetitive prompt text."]]
});

chapter({
  n: 15, slug: "rl", title: "Finetuning II: RL", topics: "preference data, reward models, RLHF with PPO, KL penalty, DPO", depth: "full", widget: "rl",
  idea: `<p><strong>SFT imitates good answers. Preference tuning pushes the model toward the better of two answers.</strong> There are two routes, and you build both.</p>
<ul><li><strong>Reward model.</strong> Take the chat model, replace its output layer with a single number, and train it on pairs: the preferred story should score higher. The loss is Bradley-Terry: <code>-log σ(r_chosen − r_rejected)</code>.</li>
<li><strong>PPO</strong>, the original ChatGPT recipe. Sample stories from the current model, score them with the reward model, subtract a <strong>KL penalty</strong> for drifting from the SFT model, then raise the probability of better-than-expected samples. PPO's ratio clip removes the incentive to keep pushing a sample once its probability has moved more than 20% from where it was when sampled.</li>
<li><strong>Why the KL penalty matters.</strong> The reward model is an imperfect stand-in for what you want. Optimize it too hard and the policy finds outputs it overrates. In our tests, a learning rate 10× too high taught the model to answer with an empty story.</li>
<li><strong>Baseline.</strong> Classic PPO trains a separate value network to predict the expected reward. We sample 4 stories per prompt and compare each one to its siblings instead (the GRPO approach from DeepSeek), which removes a fourth model.</li>
<li><strong>DPO</strong> (Rafailov and colleagues, 2023) reaches the same objective directly from pairs, with no reward model and no sampling loop. Simpler and stable, which is why many open models use it.</li>
<li><strong>Measure it.</strong> Losses during training don't tell you which model is better at the job. <code>eval.py</code> asks every chat checkpoint the same new questions with the same random seeds and counts how often each story contains the requested word, finishes on its own, and repeats itself. Those are diagnostics, not a quality score, so it also saves every story for you to read.</li></ul>
<p>Our preference data is synthetic: the chosen story is about the requested topic, the rejected one is a fluent story about something else. That makes the mechanics easy to see, but it is not human judgment of story quality. Real RLHF data comes from people comparing two answers, and the hard pairs are the ones where both answers are on topic and only one is good.</p>`,
  code: [{ file: "reward.py", note: "The reward model and its training. Starts from chat.pt.", src: "\"\"\"Train a reward model on preference pairs (Chapter 15). The first half of classic RLHF.\n\nThe reward model is the chat GPT with its output layer swapped for a single number. Trained\nwith the Bradley-Terry loss: P(chosen beats rejected) = sigmoid(r_chosen - r_rejected).\n\n  python reward.py        # needs chat.pt and sft.json -> reward.pt\n\"\"\"\nimport argparse, json, random, torch, torch.nn as nn, torch.nn.functional as F\nfrom model import GPT, GPTConfig\nfrom bpe import BPETokenizer\nfrom device import pick_device\n\nT = 256\n\nclass RewardModel(nn.Module):\n    def __init__(self, cfg):\n        super().__init__()\n        self.cfg = cfg\n        self.gpt = GPT(GPTConfig(**cfg))\n        self.head = nn.Linear(cfg[\"n_embd\"], 1)\n\n    def forward(self, idx, last):\n        \"\"\"idx: (B, T) token ids. last: (B,) position of each sequence's final real token.\"\"\"\n        g = self.gpt\n        x = g.wte(idx) + g.wpe(torch.arange(idx.size(1), device=idx.device))\n        for block in g.blocks:\n            x, _ = block(x)\n        h = g.ln_f(x)[torch.arange(idx.size(0), device=idx.device), last]\n        return self.head(h).squeeze(-1)          # one score per sequence\n\ndef encode(tok, prompt, response):\n    ids = tok.encode(f\"<|user|>{prompt}<|assistant|>\") + tok.encode_ordinary(response) + [tok.special[\"<|endoftext|>\"]]\n    return ids[:T]\n\ndef pad(seqs, fill):\n    L = max(len(s) for s in seqs)\n    return torch.tensor([s + [fill] * (L - len(s)) for s in seqs]), torch.tensor([len(s) - 1 for s in seqs])\n\ndef load_reward_model(path, device):\n    ck = torch.load(path, map_location=device)\n    rm = RewardModel(ck[\"cfg\"]).to(device)\n    rm.load_state_dict(ck[\"model\"])\n    return rm.eval()\n\ndef make_pair(data, with_word=False):\n    ex = random.choice(data)\n    for _ in range(100):                                   # find a story about something else\n        bad = random.choice(data)\n        if ex[\"word\"] not in bad[\"response\"].lower():\n            break\n    pair = (ex[\"prompt\"], ex[\"response\"], bad[\"response\"])   # prompt, chosen, rejected\n    return pair + (ex[\"word\"],) if with_word else pair\n\nif __name__ == \"__main__\":\n    p = argparse.ArgumentParser()\n    p.add_argument(\"--steps\", type=int, default=400)\n    args = p.parse_args()\n    device = pick_device()\n    random.seed(0); torch.manual_seed(0)\n    tok = BPETokenizer().load(\"tok.pkl\")\n    EOT = tok.special[\"<|endoftext|>\"]\n\n    ck = torch.load(\"chat.pt\", map_location=device)\n    T = min(T, ck[\"cfg\"][\"block_size\"])                 # never longer than the model's context\n    rm = RewardModel(ck[\"cfg\"]).to(device)\n    rm.gpt.load_state_dict(ck[\"model\"])          # start from the chat model's understanding of text\n\n    data = json.load(open(\"sft.json\"))\n    split = int(0.9 * len(data))\n    train_data, test_data = data[:split], data[split:]\n\n    def batch(src, n=8):\n        pairs = [make_pair(src) for _ in range(n)]\n        seqs = [encode(tok, p, r) for p, c, rj in pairs for r in (c, rj)]   # chosen, rejected, ...\n        idx, last = pad(seqs, EOT)\n        return idx.to(device), last.to(device)\n\n    opt = torch.optim.AdamW(rm.parameters(), lr=5e-5, weight_decay=0.0)\n    for step in range(args.steps):\n        idx, last = batch(train_data)\n        r = rm(idx, last)\n        loss = -F.logsigmoid(r[0::2] - r[1::2]).mean()       # Bradley-Terry\n        opt.zero_grad(); loss.backward(); opt.step()\n        if step % 50 == 0:\n            print(f\"step {step:3d}  loss {loss.item():.3f}  train acc {(r[0::2] > r[1::2]).float().mean().item():.2f}\")\n\n    rm.eval(); correct = total = 0\n    word_rule = longer = 0                           # two simple rules, scored on the same pairs\n    with torch.no_grad():\n        for _ in range(25):\n            pairs = [make_pair(test_data, with_word=True) for _ in range(8)]\n            seqs = [encode(tok, p, r) for p, c, rj, w in pairs for r in (c, rj)]\n            idx, last = pad(seqs, EOT)\n            r = rm(idx.to(device), last.to(device))\n            correct += (r[0::2] > r[1::2]).sum().item()\n            total += len(pairs)\n            for p, c, rj, w in pairs:\n                word_rule += (w in c.lower()) > (w in rj.lower()) or ((w in c.lower()) == (w in rj.lower()) and random.random() < 0.5)\n                longer += len(c) > len(rj)\n    print(f\"held-out accuracy {correct / total:.2f} on {total} pairs the reward model never trained on\")\n    print(f\"baselines on the same pairs: 'contains the topic word' {word_rule / total:.2f}, 'longer story' {longer / total:.2f}\")\n    print(\"These preferences are synthetic: the chosen story mentions the requested topic and the rejected one\")\n    print(\"does not. A word check nearly solves the task, so high accuracy shows the reward model learned that\")\n    print(\"rule, not general human taste in stories.\")\n    torch.save({\"model\": rm.state_dict(), \"cfg\": ck[\"cfg\"]}, \"reward.pt\")" },
    { file: "ppo.py", note: "The RLHF loop: rollouts, KL-penalized reward, group-relative advantages, clipped updates.", src: "\"\"\"RLHF with PPO (Chapter 15). The second half: optimize the chat model against the reward model.\n\nEach iteration:\n  1. Rollout   sample G stories for each of P prompts from the current policy\n  2. Score     reward model score, minus a KL penalty for drifting from the SFT model\n  3. Advantage compare each story to the others for the same prompt (group baseline)\n  4. Update    a few steps of PPO's clipped objective on those samples\n\nClassic PPO trains a value network as the baseline. Comparing within a group of samples\ninstead (as in GRPO) removes that fourth model and works well for whole-response rewards.\n\n  python ppo.py           # needs chat.pt, reward.pt, sft.json -> chat_ppo.pt\n\"\"\"\nimport argparse, time, copy, json, random, torch, torch.nn.functional as F\nfrom model import GPT, GPTConfig\nfrom bpe import BPETokenizer\nfrom reward import load_reward_model\nfrom device import pick_device\n\ndevice = pick_device()\nrandom.seed(0); torch.manual_seed(0)\nP, G = 4, 4                  # prompts per iteration, samples per prompt\np = argparse.ArgumentParser()\np.add_argument(\"--iters\", type=int, default=150)\nargs = p.parse_args()\niters, max_new = args.iters, 200\nppo_epochs, clip, kl_coef, lr = 2, 0.2, 0.05, 1e-5\n\ntok = BPETokenizer().load(\"tok.pkl\")\nEOT = tok.special[\"<|endoftext|>\"]\nck = torch.load(\"chat.pt\", map_location=device)\npolicy = GPT(GPTConfig(**ck[\"cfg\"])).to(device)\npolicy.load_state_dict(ck[\"model\"])\nref = copy.deepcopy(policy).eval()                       # frozen SFT model, the KL anchor\nrm = load_reward_model(\"reward.pt\", device)\nfor p in list(ref.parameters()) + list(rm.parameters()):\n    p.requires_grad = False\nopt = torch.optim.AdamW(policy.parameters(), lr=lr, weight_decay=0.0)\nprompts = sorted({ex[\"prompt\"] for ex in json.load(open(\"sft.json\"))})\n\ndef token_logprobs(model, seq):\n    \"\"\"log p(seq[t+1] | seq[:t+1]) for every position: (N, L-1).\"\"\"\n    logits, _ = model(seq[:, :-1])\n    return torch.gather(F.log_softmax(logits.float(), -1), 2, seq[:, 1:].unsqueeze(-1)).squeeze(-1)\n\n@torch.no_grad()\ndef rollout():\n    seqs, masks, lasts, groups = [], [], [], []\n    policy.eval()\n    for gi, prompt in enumerate(random.sample(prompts, P)):\n        p_ids = tok.encode(f\"<|user|>{prompt}<|assistant|>\")\n        n_new = min(max_new, policy.cfg.block_size - len(p_ids))       # stay inside the context\n        out = policy.generate_cached(torch.tensor([p_ids] * G, device=device), n_new, temperature=1.0)\n        for row in out.tolist():\n            resp = row[len(p_ids):]\n            if EOT in resp:\n                resp = resp[:resp.index(EOT) + 1]        # keep the EOT, drop anything after it\n            seqs.append(p_ids + resp)\n            masks.append([0] * (len(p_ids) - 1) + [1] * len(resp))   # aligned with targets seq[1:]\n            lasts.append(len(p_ids) + len(resp) - 1)\n            groups.append(gi)\n    policy.train()\n    L = max(len(s) for s in seqs)\n    seq = torch.tensor([s + [EOT] * (L - len(s)) for s in seqs], device=device)\n    mask = torch.tensor([m + [0] * (L - 1 - len(m)) for m in masks], device=device, dtype=torch.float)\n    return seq, mask, torch.tensor(lasts, device=device), torch.tensor(groups, device=device)\n\nt_start = time.time()\nfor it in range(iters):\n    seq, mask, last, group = rollout()\n    with torch.no_grad():\n        old_lp = token_logprobs(policy, seq)\n        ref_lp = token_logprobs(ref, seq)\n        score = rm(seq, last)                                    # reward model's opinion\n        kl = ((old_lp - ref_lp) * mask).sum(-1)                  # how far each sample drifted\n        R = score - kl_coef * kl\n        adv = torch.zeros_like(R)\n        for g in group.unique():                                 # group-relative advantage\n            sel = group == g\n            adv[sel] = (R[sel] - R[sel].mean()) / (R[sel].std() + 1e-6)\n\n    for _ in range(ppo_epochs):\n        new_lp = token_logprobs(policy, seq)\n        ratio = torch.exp(new_lp - old_lp)\n        A = adv.unsqueeze(-1)\n        surrogate = torch.min(ratio * A, ratio.clamp(1 - clip, 1 + clip) * A)\n        loss = -(surrogate * mask).sum() / mask.sum()\n        opt.zero_grad(); loss.backward()\n        torch.nn.utils.clip_grad_norm_(policy.parameters(), 1.0)\n        opt.step()\n\n    if it % 10 == 0:\n        frac = (((ratio - 1).abs() > clip).float() * mask).sum() / mask.sum()\n        print(f\"iter {it:3d} | reward {score.mean().item():+.3f} | KL {kl.mean().item():6.2f} | \"\n              f\"clipped {frac.item():.2f} | length {mask.sum(-1).mean().item():.0f}\")\n    if it % 50 == 0:\n        idx = torch.tensor([tok.encode(\"<|user|>Tell me a story about a cat.<|assistant|>\")], device=device)\n        policy.eval()\n        out = tok.decode(policy.generate_cached(idx, 120, temperature=0.8, top_k=50)[0].tolist())\n        policy.train()\n        print(\"   sample:\", out.split(\"<|assistant|>\")[1].split(\"<|endoftext|>\")[0][:300])\n\ntorch.save({\"model\": policy.state_dict(), \"cfg\": ck[\"cfg\"],\n            \"train\": {**vars(args), \"script\": \"ppo.py\", \"from\": \"chat.pt\", \"seconds\": round(time.time() - t_start, 1)}}, \"chat_ppo.pt\")" },
    { file: "dpo.py", note: "Direct preference optimization, the one-step alternative.", src: "import argparse, time, copy, json, random, torch, torch.nn.functional as F\nfrom model import GPT, GPTConfig\nfrom bpe import BPETokenizer\nfrom device import pick_device\n\ndevice = pick_device()\nrandom.seed(0)\ntok = BPETokenizer().load(\"tok.pkl\")\nEOT = tok.special[\"<|endoftext|>\"]\np = argparse.ArgumentParser()\np.add_argument(\"--steps\", type=int, default=300)\nargs = p.parse_args()\nT, beta, steps, pairs_per_batch = 256, 0.1, args.steps, 8\n\nck = torch.load(\"chat.pt\", map_location=device)\npolicy = GPT(GPTConfig(**ck[\"cfg\"])).to(device)\nT = min(T, policy.cfg.block_size)                  # never longer than the model's context\npolicy.load_state_dict(ck[\"model\"])\nref = copy.deepcopy(policy).eval()\nfor p in ref.parameters():\n    p.requires_grad = False\n\ndata = json.load(open(\"sft.json\"))\ndef encode(prompt, resp):\n    p = tok.encode(f\"<|user|>{prompt}<|assistant|>\")\n    r = tok.encode_ordinary(resp) + [EOT]\n    ids, lab = (p + r)[:T + 1], ([-100] * len(p) + r)[:T + 1]\n    x, y = ids[:-1], lab[1:]\n    return x + [EOT] * (T - len(x)), y + [-100] * (T - len(y))\n\ndef batch():\n    xs, ys = [], []\n    for ex in random.sample(data, pairs_per_batch):\n        for _ in range(100):                               # find a story about something else\n            bad = random.choice(data)\n            if ex[\"word\"] not in bad[\"response\"].lower():\n                break\n        for resp in (ex[\"response\"], bad[\"response\"]):     # chosen, rejected\n            x, y = encode(ex[\"prompt\"], resp); xs.append(x); ys.append(y)\n    return torch.tensor(xs, device=device), torch.tensor(ys, device=device)\n\ndef seq_logp(model, x, y):\n    logp = F.log_softmax(model(x)[0], dim=-1)\n    tok_lp = logp.gather(-1, y.clamp(min=0).unsqueeze(-1)).squeeze(-1)\n    return (tok_lp * (y != -100)).sum(-1)                 # sum over response tokens\n\nopt = torch.optim.AdamW(policy.parameters(), lr=5e-6)\nt_start = time.time()\nfor step in range(steps):\n    x, y = batch()\n    pi = seq_logp(policy, x, y)\n    with torch.no_grad():\n        rf = seq_logp(ref, x, y)\n    margin = beta * ((pi[0::2] - rf[0::2]) - (pi[1::2] - rf[1::2]))\n    loss = -F.logsigmoid(margin).mean()\n    opt.zero_grad(); loss.backward(); opt.step()\n    if step % 25 == 0:\n        print(f\"step {step:3d} | loss {loss.item():.3f} | pref acc {(margin > 0).float().mean().item():.2f}\")\n\ntorch.save({\"model\": policy.state_dict(), \"cfg\": ck[\"cfg\"],\n            \"train\": {**vars(args), \"script\": \"dpo.py\", \"from\": \"chat.pt\", \"seconds\": round(time.time() - t_start, 1)}}, \"chat_dpo.pt\")" },
    { file: "eval.py", note: "Puts numbers on it: perplexity for every checkpoint, plus topic-word match, finish rate, repetition and length for the chat models, on prompt phrasings they never trained on.", src: "\"\"\"Score your checkpoints side by side (Chapters 7, 14 and 15).\n\n  python eval.py                                 # every checkpoint it finds\n  python eval.py --ckpts chat.pt chat_dpo.pt --n 100\n\nTwo measurements:\n  perplexity  on held-out stories (val.bin): how well the model predicts real text. Lower is better.\n  following   for chat models, on prompt phrasings never used in training:\n                topic word  how often the story contains the requested word. A word match only:\n                            it says nothing about whether the story is good or coherent.\n                finished    how often the model ends the story itself (emits <|endoftext|>)\n                repeats     share of 4-word phrases that repeat earlier ones; high means looping\n                length      average tokens per story\nRead the numbers together and read the samples: no single one of them measures story quality.\nEvery model gets the same prompts and the same random seeds, so differences come from the weights.\n\"\"\"\nimport argparse, json, math, os, random, re, numpy as np, torch\nfrom model import GPT, GPTConfig\nfrom bpe import BPETokenizer\nfrom device import pick_device\n\np = argparse.ArgumentParser()\np.add_argument(\"--ckpts\", nargs=\"*\", default=None)\np.add_argument(\"--n\", type=int, default=50, help=\"prompts per chat model\")\np.add_argument(\"--max_new\", type=int, default=200)\np.add_argument(\"--json\", default=None, help=\"also write results and sample stories here\")\nargs = p.parse_args()\n\ndevice = pick_device()\ntok = BPETokenizer().load(\"tok.pkl\")\nEOT = tok.special[\"<|endoftext|>\"]\nckpts = args.ckpts or [c for c in [\"ckpt.pt\", \"chat.pt\", \"chat_dpo.pt\", \"chat_ppo.pt\"] if os.path.exists(c)]\n\nTOPICS = [\"dog\", \"cat\", \"ball\", \"tree\", \"bird\", \"fish\", \"car\", \"cake\", \"boat\", \"flower\",\n          \"dragon\", \"star\", \"moon\", \"bear\", \"frog\", \"train\", \"kite\", \"rabbit\", \"princess\", \"robot\"]\nTEMPLATES = [\"Please write a story where a {w} is the hero.\",          # none of these phrasings\n             \"Could you tell me a short tale about a {w}?\",            # appear in make_sft.py\n             \"Make up a bedtime story featuring a {w}.\"]\nrng = random.Random(0)\nPROMPTS = [(w, rng.choice(TEMPLATES).format(w=w)) for w in (rng.choice(TOPICS) for _ in range(args.n))]\n\ndef load(path):\n    ck = torch.load(path, map_location=device)\n    m = GPT(GPTConfig(**ck[\"cfg\"])).to(device).eval()\n    m.load_state_dict(ck[\"model\"])\n    return m\n\n@torch.no_grad()\ndef perplexity(m, batches=20, B=16):\n    val = np.memmap(\"val.bin\", dtype=np.uint16, mode=\"r\")\n    T = min(256, m.cfg.block_size)\n    g = np.random.default_rng(0)                       # the same text for every model\n    tot = 0.0\n    for _ in range(batches):\n        ix = g.integers(0, len(val) - T - 1, B)\n        x = torch.stack([torch.from_numpy(val[i:i + T].astype(np.int64)) for i in ix]).to(device)\n        y = torch.stack([torch.from_numpy(val[i + 1:i + 1 + T].astype(np.int64)) for i in ix]).to(device)\n        tot += m(x, y)[1].item()\n    return math.exp(tot / batches)\n\n@torch.no_grad()\ndef following(m):\n    on_topic = finished = length = 0\n    rep, samples = [], []\n    for i, (word, prompt) in enumerate(PROMPTS):\n        torch.manual_seed(i)                           # same sampling noise for every model\n        ids = tok.encode(f\"<|user|>{prompt}<|assistant|>\")\n        out = m.generate_cached(torch.tensor([ids], device=device), args.max_new, temperature=0.8, top_k=50)\n        resp = out[0, len(ids):].tolist()\n        if EOT in resp:\n            finished += 1\n            resp = resp[:resp.index(EOT)]\n        text = tok.decode([t for t in resp if t < EOT])\n        hit = bool(re.search(rf\"\\b{word}s?\\b\", text.lower()))\n        on_topic += hit\n        length += len(resp)\n        words = re.findall(r\"[a-z']+\", text.lower())\n        grams = [tuple(words[j:j + 4]) for j in range(len(words) - 3)]\n        rep.append(1 - len(set(grams)) / len(grams) if grams else 0.0)\n        samples.append({\"seed\": i, \"prompt\": prompt, \"topic\": word, \"topic_word_present\": hit,\n                        \"finished\": EOT in out[0, len(ids):].tolist(), \"story\": text})\n    n = len(PROMPTS)\n    return {\"topic_word\": on_topic / n, \"finished\": finished / n, \"repeats\": sum(rep) / n,\n            \"length\": length / n, \"samples\": samples}\n\nresults = {\"prompts\": len(PROMPTS), \"max_new\": args.max_new, \"checkpoints\": {}}\nprint(f\"{'checkpoint':14s} {'perplexity':>10s} {'topic word':>11s} {'finished':>9s} {'repeats':>8s} {'length':>7s}\")\nfor path in ckpts:\n    m = load(path)\n    row = {\"perplexity\": perplexity(m)}\n    if path.startswith(\"chat\"):\n        row.update(following(m))\n        print(f\"{path:14s} {row['perplexity']:10.2f} {row['topic_word']:11.0%} {row['finished']:9.0%} \"\n              f\"{row['repeats']:8.0%} {row['length']:7.0f}\")\n    else:\n        print(f\"{path:14s} {row['perplexity']:10.2f} {'':>11s} {'':>9s} {'':>8s} {'':>7s}   (base model: not trained to follow requests)\")\n    results[\"checkpoints\"][path] = row\nprint(f\"{len(PROMPTS)} prompts per chat model, same prompts and seeds for each.\")\nif args.json:\n    json.dump(results, open(args.json, \"w\"), indent=1)" }],

  expect: `<code>reward.py</code>: loss falls from about 0.69 and held-out accuracy ends well above 0.5 (0.91 on a small model in our test). It also prints a plain word check scored on the same pairs, which is nearly perfect: this synthetic task is easy, and the baseline keeps that visible. <code>ppo.py</code>: the reward column rises unevenly while KL climbs into the single or low double digits and story length stays roughly steady. If length collapses toward 1, the policy has found that an instant end-of-story scores well: lower <code>lr</code> or raise <code>kl_coef</code>. <code>dpo.py</code>: loss starts at 0.693 and falls, preference accuracy climbs toward 0.9. <code>eval.py</code> prints one row per checkpoint. Preference tuning should raise "topic word" over <code>chat.pt</code> while perplexity barely moves; a large jump in perplexity means the model drifted too far from what it learned in pretraining.`,

  idea: `<p><strong>Serving is a loop that streams tokens to a browser as they are sampled.</strong> One small FastAPI server does three jobs: load the model once at startup, expose a <code>/chat</code> endpoint that encodes the prompt with the chat template, and stream decoded tokens back as plain text. The page reads the stream and appends text as it arrives, which is why ChatGPT appears to type.</p>
<ul><li>Load weights once, put the model in <code>eval()</code> mode, and wrap sampling in <code>torch.no_grad()</code>.</li>
<li>Stop on <code>&lt;|endoftext|&gt;</code> or a token limit.</li>
<li>Expose temperature as a request parameter; 0.7 to 0.9 reads best for stories.</li>
<li>Pick the model with <code>CKPT</code>: any checkpoint from Chapter 14 or 15.</li></ul>
<p>This first version re-runs the whole sequence for every token to keep the loop readable. Chapter 17's final <code>app.py</code> swaps in the Chapter 12 KV-cache loop, picks your best chat checkpoint automatically, and draws a picture for each story.</p>
<p>The lab runs the same streaming UX in this page, powered by the Chapter 1 bigram model, so it ignores what you type. Your trained model is what makes it answer.</p>`,
  code: [{ file: "app.py", note: "Server and a minimal chat page in one file.", src: R`import os, torch
from fastapi import FastAPI
from fastapi.responses import HTMLResponse, StreamingResponse
from pydantic import BaseModel
from model import GPT, GPTConfig
from bpe import BPETokenizer

device = "mps" if torch.backends.mps.is_available() else "cpu"
tok = BPETokenizer().load("tok.pkl")
EOT = tok.special["<|endoftext|>"]
ck = torch.load(os.environ.get("CKPT", "chat.pt"), map_location=device)   # CKPT=chat_ppo.pt to switch
model = GPT(GPTConfig(**ck["cfg"])).to(device).eval()
model.load_state_dict(ck["model"])

@torch.no_grad()
def stream_tokens(ids, max_new=300, temperature=0.8, top_k=50):
    x = torch.tensor([ids], device=device)
    for _ in range(max_new):
        logits, _ = model(x[:, -model.cfg.block_size:])
        logits = logits[0, -1] / max(temperature, 1e-3)
        v, _ = torch.topk(logits, top_k)
        logits[logits < v[-1]] = -float("inf")
        nxt = torch.multinomial(torch.softmax(logits, -1), 1)
        if nxt.item() == EOT:
            break
        x = torch.cat([x, nxt.view(1, 1)], dim=1)
        yield nxt.item()

class ChatRequest(BaseModel):
    prompt: str
    temperature: float = 0.8

app = FastAPI()

@app.post("/chat")
def chat(req: ChatRequest):
    ids = tok.encode(f"<|user|>{req.prompt}<|assistant|>")
    gen = (tok.decode([t]) for t in stream_tokens(ids, temperature=req.temperature))
    return StreamingResponse(gen, media_type="text/plain")
